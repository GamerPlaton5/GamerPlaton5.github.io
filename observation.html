<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>СМЕНА ОХРАНЫ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Russo+One&family=Orbitron:wght@500;700;900&family=VT323&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;}
  body{font-family:'Russo One',sans-serif;background:#06080a;min-height:100vh;
    display:flex;align-items:center;justify-content:center;overflow:hidden;}
  #wrap{position:relative;width:880px;max-width:98vw;height:580px;max-height:92vh;
    border-radius:14px;overflow:hidden;background:#0a0e12;
    box-shadow:0 0 80px rgba(0,180,180,.18);border:1px solid #1a3a3a;touch-action:manipulation;}
  /* === МОНИТОР === */
  #monitor{position:absolute;top:0;left:0;right:0;bottom:130px;background:#000;overflow:hidden;}
  #camView{position:absolute;inset:0;}
  canvas{display:block;width:100%;height:100%;}
  /* помехи и сетка камеры */
  #scanlines{position:absolute;inset:0;pointer-events:none;z-index:3;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.15) 2.5px,rgba(0,0,0,0) 3px);}
  #vignette{position:absolute;inset:0;pointer-events:none;z-index:3;
    box-shadow:inset 0 0 140px 20px rgba(0,0,0,.65);}
  #camLabel{position:absolute;top:10px;left:14px;z-index:4;color:#0fff80;
    font-family:'VT323',monospace;font-size:24px;letter-spacing:2px;
    text-shadow:0 0 8px rgba(0,255,128,.65);pointer-events:none;}
  #recDot{position:absolute;top:14px;right:18px;z-index:4;display:flex;align-items:center;gap:8px;
    color:#ff4444;font-family:'VT323',monospace;font-size:22px;pointer-events:none;
    text-shadow:0 0 8px #ff0000;}
  #recDot .dot{width:12px;height:12px;background:#ff3322;border-radius:50%;
    animation:rec 1.2s infinite;box-shadow:0 0 12px #ff0000;}
  @keyframes rec{0%,100%{opacity:1}50%{opacity:0.25}}
  #timeBox{position:absolute;bottom:12px;right:14px;z-index:4;color:#0fff80;
    font-family:'VT323',monospace;font-size:30px;text-shadow:0 0 8px rgba(0,255,128,.65);
    background:rgba(0,0,0,.4);padding:4px 12px;border-radius:4px;pointer-events:none;letter-spacing:3px;}

  /* === ПАНЕЛЬ УПРАВЛЕНИЯ === */
  #panel{position:absolute;bottom:0;left:0;right:0;height:130px;
    background:linear-gradient(180deg,#101820,#070a0d);
    border-top:2px solid #1a3a3a;display:flex;align-items:center;gap:10px;padding:10px;}
  /* кнопки камер */
  .camBtn{flex:0 0 auto;width:120px;height:100px;border-radius:8px;border:2px solid #2a4040;
    background:linear-gradient(180deg,#1a2228,#0a1014);color:#aac;
    font-family:'VT323',monospace;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;font-size:14px;letter-spacing:1px;
    transition:all .12s;position:relative;}
  .camBtn .num{font-size:32px;font-family:'Orbitron';font-weight:800;color:#0c8;}
  .camBtn:hover{border-color:#0f8;color:#fff;}
  .camBtn.active{border-color:#0fff80;box-shadow:0 0 18px rgba(0,255,128,.4);}
  .camBtn.active .num{color:#0fff80;}
  .camBtn .alert{position:absolute;top:-6px;right:-6px;background:#f33;color:#fff;
    border-radius:50%;width:22px;height:22px;font-size:14px;font-family:'Orbitron';font-weight:800;
    display:flex;align-items:center;justify-content:center;animation:pulse 1s infinite;display:none;}
  .camBtn.has-alert .alert{display:flex;}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

  /* центральная зона — кнопка отметить */
  #reportArea{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
  #reportBtn{background:linear-gradient(135deg,#cc4400,#702000);color:#fff;border:none;border-radius:8px;
    padding:14px 26px;font-family:'Orbitron';font-weight:800;font-size:14px;letter-spacing:2px;
    cursor:pointer;text-transform:uppercase;box-shadow:0 0 18px rgba(255,80,40,.5);}
  #reportBtn:active{transform:scale(.96);}
  #reportBtn:disabled{background:#333;color:#777;cursor:not-allowed;box-shadow:none;}
  #activeCount{color:#fc6;font-family:'Orbitron';font-size:13px;letter-spacing:2px;}
  #activeCount.warn{color:#ff5544;animation:flicker 0.8s infinite;}
  @keyframes flicker{0%,100%{opacity:1}50%{opacity:.5}}

  /* модал выбора типа */
  #typeModal{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.85);}
  #typeModal.show{display:flex;}
  .modalBox{background:#0e1620;border:2px solid #2a4a5a;border-radius:14px;padding:20px;width:480px;max-width:92%;}
  .modalBox h3{color:#0fff80;font-family:'Orbitron';letter-spacing:2px;margin-bottom:10px;font-size:18px;text-align:center;}
  .modalBox p{color:#9ab;font-size:13px;margin-bottom:14px;text-align:center;}
  .typeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .typeBtn{background:rgba(20,40,50,.7);border:1px solid #3a5a70;border-radius:8px;padding:14px 8px;
    color:#dce;font-family:'Russo One';cursor:pointer;text-align:center;font-size:13px;transition:.12s;
    display:flex;flex-direction:column;align-items:center;gap:4px;}
  .typeBtn .icon{font-size:30px;line-height:1;}
  .typeBtn:hover{background:rgba(0,255,128,.18);border-color:#0f8;color:#fff;}
  .modalBox .cancel{margin-top:12px;background:#333;color:#aaa;border:none;border-radius:6px;
    padding:8px 16px;font-family:'Russo One';cursor:pointer;width:100%;}
  .modalBox .cancel:hover{background:#555;color:#fff;}

  /* всплывающее сообщение */
  #toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:18;
    background:rgba(40,10,10,.9);border:2px solid #f44;border-radius:8px;
    color:#ff7766;font-family:'Orbitron';font-weight:800;font-size:16px;letter-spacing:2px;
    padding:10px 24px;text-shadow:0 0 8px #f00;opacity:0;pointer-events:none;
    transition:opacity .3s;}
  #toast.show{opacity:1;}
  #toast.ok{background:rgba(10,40,20,.9);border-color:#0fa060;color:#7fffaa;text-shadow:0 0 8px #0f8;}

  /* предупреждение */
  #warnOverlay{position:absolute;inset:0;z-index:15;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.4);pointer-events:none;}
  #warnOverlay.show{display:flex;}
  #warnOverlay .txt{color:#ff5544;font-family:'Orbitron';font-weight:900;font-size:34px;letter-spacing:5px;
    text-shadow:0 0 30px #ff0000;animation:warn 0.6s infinite;text-align:center;background:rgba(0,0,0,.5);padding:14px 30px;border-radius:8px;}
  @keyframes warn{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(1.05)}}

  /* скример */
  #screamer{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
    background:#000;}
  #screamer.show{display:flex;}
  #screamer .face{font-size:380px;line-height:1;animation:shake 0.05s infinite;text-shadow:0 0 80px #f00;}
  @keyframes shake{0%{transform:translate(-3px,-2px) scale(1)}25%{transform:translate(4px,3px) scale(1.02)}50%{transform:translate(-2px,4px) scale(.98)}75%{transform:translate(3px,-3px) scale(1.03)}100%{transform:translate(-3px,2px) scale(1)}}

  /* экраны */
  #screen{position:absolute;inset:0;z-index:25;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;color:#cde;padding:30px;
    background:radial-gradient(ellipse at center,#0a1820 0%,#02050a 70%);}
  #screen.hidden{display:none;}
  h1{font-size:50px;color:#0fff80;text-shadow:0 0 30px #0fa060;margin-bottom:8px;letter-spacing:6px;font-family:'Orbitron';}
  h2{font-size:18px;color:#9cc;letter-spacing:3px;margin-bottom:18px;font-family:'Orbitron';}
  p{font-size:15px;line-height:1.8;margin-bottom:14px;color:#bcd;max-width:580px;}
  .key{background:#0e2238;border:1px solid #4a8;border-radius:4px;padding:2px 8px;color:#9cf;font-family:'Russo One';}
  .btn{background:linear-gradient(135deg,#0c8,#063);color:#001;border:none;
    border-radius:6px;padding:14px 46px;font-family:'Orbitron';font-size:20px;font-weight:900;
    letter-spacing:3px;cursor:pointer;box-shadow:0 0 28px rgba(0,255,128,.4);text-transform:uppercase;}
  .btn:active{transform:scale(.96);}
  .btn.dead{background:linear-gradient(135deg,#922,#400);color:#fff;box-shadow:0 0 28px rgba(255,40,40,.5);}
</style>
</head>
<body>
<div id="wrap">
  <div id="monitor">
    <div id="camView">
      <canvas id="cv" width="880" height="450"></canvas>
    </div>
    <div id="scanlines"></div>
    <div id="vignette"></div>
    <div id="camLabel">CAM-01 • ВХОД</div>
    <div id="recDot"><div class="dot"></div>REC</div>
    <div id="timeBox">00:00</div>
  </div>
  <div id="panel">
    <button class="camBtn active" data-cam="0"><div class="num">1</div>ВХОД<div class="alert">!</div></button>
    <button class="camBtn" data-cam="1"><div class="num">2</div>МАГАЗИН<div class="alert">!</div></button>
    <button class="camBtn" data-cam="2"><div class="num">3</div>КАФЕ<div class="alert">!</div></button>
    <button class="camBtn" data-cam="3"><div class="num">4</div>ЛЕСТНИЦА<div class="alert">!</div></button>
    <button class="camBtn" data-cam="4"><div class="num">5</div>СКЛАД<div class="alert">!</div></button>
    <div id="reportArea">
      <button id="reportBtn">ОТМЕТИТЬ АНОМАЛИЮ</button>
    </div>
  </div>
  <div id="warnOverlay"><div class="txt">⚠ ОБНАРУЖЕНО НЕСКОЛЬКО АКТИВНЫХ АНОМАЛИЙ ⚠</div></div>
  <div id="toast"></div>
  <div id="typeModal">
    <div class="modalBox">
      <h3>ТИП АНОМАЛИИ</h3>
      <p>На какой камере и какого типа?</p>
      <div id="curCamLabel" style="text-align:center;color:#0fff80;font-family:'VT323';font-size:22px;margin-bottom:10px;letter-spacing:2px;"></div>
      <div class="typeGrid" id="typeGrid"></div>
      <button class="cancel" id="cancelBtn">ОТМЕНА</button>
    </div>
  </div>
  <div id="screamer"><div class="face">👹</div></div>
  <div id="screen"></div>
</div>
<script>
'use strict';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const CW=cv.width,CH=cv.height;
const screen=document.getElementById('screen');
const camLabel=document.getElementById('camLabel');
const timeBox=document.getElementById('timeBox');
const warnOverlay=document.getElementById('warnOverlay');
const screamerEl=document.getElementById('screamer');
const typeModal=document.getElementById('typeModal');
const typeGrid=document.getElementById('typeGrid');
const curCamLabel=document.getElementById('curCamLabel');
const reportBtn=document.getElementById('reportBtn');
const camBtns=document.querySelectorAll('.camBtn');

// ============ АУДИО ============
let audioCtx=null;
function initAudio(){if(audioCtx)return;try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){audioCtx=null;}}
function tone(f,dur,type='sine',vol=0.12,when=0){
  if(!audioCtx)return;
  const t=audioCtx.currentTime+when;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+0.02);
}
function sfxClick(){initAudio();tone(800,0.04,'square',0.10);}
function sfxBeep(){initAudio();tone(1200,0.08,'square',0.12);}
function sfxCorrect(){initAudio();[523,659,784].forEach((n,i)=>tone(n,0.12,'triangle',0.16,i*0.06));}
function sfxWrong(){initAudio();tone(220,0.2,'sawtooth',0.16);tone(170,0.2,'sawtooth',0.15,0.1);}
function sfxWarn(){initAudio();tone(440,0.15,'square',0.18);tone(440,0.15,'square',0.18,0.2);}
function sfxScream(){initAudio();
  if(!audioCtx)return;
  const t=audioCtx.currentTime;
  // громкий шум + низкий рык
  const bufSize=audioCtx.sampleRate*1.2;
  const buf=audioCtx.createBuffer(1,bufSize,audioCtx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) data[i]=(Math.random()*2-1)*(1-i/bufSize);
  const src=audioCtx.createBufferSource();src.buffer=buf;
  const g=audioCtx.createGain();g.gain.value=0.5;
  src.connect(g);g.connect(audioCtx.destination);src.start(t);
  // низкий рык
  const o=audioCtx.createOscillator(),og=audioCtx.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(80,t);
  o.frequency.exponentialRampToValueAtTime(40,t+0.8);
  og.gain.setValueAtTime(0.4,t);og.gain.exponentialRampToValueAtTime(0.0001,t+1.0);
  o.connect(og);og.connect(audioCtx.destination);o.start(t);o.stop(t+1.1);
}
function sfxWin(){initAudio();[523,659,784,1046,1318].forEach((n,i)=>tone(n,0.2,'triangle',0.18,i*0.12));}

// тихий гул фоном
let hum=null,humOn=false;
function startHum(){
  initAudio();if(!audioCtx)return;
  if(audioCtx.state==='suspended')audioCtx.resume();
  if(humOn)return;
  humOn=true;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='sine';o.frequency.value=60;g.gain.value=0.04;
  o.connect(g);g.connect(audioCtx.destination);o.start();
  hum={o,g};
}
function stopHum(){if(hum){hum.o.stop();hum=null;}humOn=false;}

// ============ ЛОКАЦИИ ============
// Каждая камера — функция отрисовки + список "якорей" для объектов, которые могут меняться
const CAMS=[
  {name:'CAM-01 • ВХОД ТЦ', short:'ВХОД', draw:drawCamEntrance},
  {name:'CAM-02 • МАГАЗИН ОДЕЖДЫ', short:'МАГАЗИН', draw:drawCamStore},
  {name:'CAM-03 • КАФЕ', short:'КАФЕ', draw:drawCamCafe},
  {name:'CAM-04 • ЛЕСТНИЦА', short:'ЛЕСТНИЦА', draw:drawCamStairs},
  {name:'CAM-05 • СКЛАД', short:'СКЛАД', draw:drawCamWarehouse}
];

// ============ ТИПЫ АНОМАЛИЙ ============
const ANOMALY_TYPES=[
  {id:'move',     name:'Движение объекта',  icon:'➡️'},
  {id:'extra',    name:'Лишний объект',     icon:'➕'},
  {id:'intruder', name:'Чужой',             icon:'👤'},
  {id:'glitch',   name:'Неисправность',     icon:'📺'},
  {id:'sound',    name:'Звук/шум',          icon:'🔊'},
  {id:'change',   name:'Изменение объекта', icon:'🔄'}
];

// ============ СОСТОЯНИЕ ============
let stage='menu', curCam=0, gameTime=0, gameStartReal=0;
let anomalies=[]; // {camIdx, type, since}
let nextAnomalyTimer=0;
let warned=false;
const HOUR_DURATION=300; // 5 минут реального времени = 1 час в игре (300 сек)
const TOTAL_HOURS=6;     // 00:00 → 06:00
let glitchEnd=0; // время до которого активен глитч-эффект (для камер с anomaly type 'glitch')

// ============ КАМЕРЫ — ОТРИСОВКА ============
// Базовый «ночной» оттенок + объекты
function nightTint(){
  ctx.fillStyle='rgba(0,30,40,.35)';
  ctx.fillRect(0,0,CW,CH);
}

function drawCamEntrance(){
  // фон — пол и стены ТЦ
  const g=ctx.createLinearGradient(0,0,0,CH);
  g.addColorStop(0,'#1a2530');g.addColorStop(1,'#0a1218');
  ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);
  // колонны
  ctx.fillStyle='#2a3540';
  ctx.fillRect(120,0,40,CH);
  ctx.fillRect(720,0,40,CH);
  // стеклянные двери
  ctx.fillStyle='#0c1820';
  ctx.fillRect(340,80,200,260);
  ctx.strokeStyle='#7adfff';ctx.lineWidth=2;
  ctx.strokeRect(340,80,200,260);
  ctx.beginPath();ctx.moveTo(440,80);ctx.lineTo(440,340);ctx.stroke();
  // пол
  ctx.fillStyle='#1f2a35';ctx.fillRect(0,340,CW,CH-340);
  // декоративные блики плитки
  ctx.strokeStyle='rgba(120,180,200,.06)';ctx.lineWidth=1;
  for(let i=0;i<10;i++){ctx.beginPath();ctx.moveTo(0,340+i*12);ctx.lineTo(CW,340+i*12);ctx.stroke();}
  // растения по углам
  ctx.font='40px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🪴',60,360);ctx.fillText('🪴',820,360);
  // вывеска MALL
  ctx.fillStyle='#0d3a5a';ctx.fillRect(280,20,320,40);
  ctx.fillStyle='#fc6';ctx.font='28px Orbitron';
  ctx.fillText('MALL — 24/7',440,42);
  // банкомат
  ctx.fillStyle='#3a4a5a';ctx.fillRect(40,180,80,120);
  ctx.fillStyle='#0fff80';ctx.fillRect(50,200,60,30);
  ctx.font='14px VT323';ctx.fillStyle='#000';ctx.fillText('ATM',80,218);

  // охранник за стойкой (всегда)
  ctx.font='40px serif';ctx.fillText('👮',640,400);
  // стойка
  ctx.fillStyle='#4a3018';ctx.fillRect(600,380,90,40);

  // динамические объекты по аномалиям
  drawAnomaliesForCam(0);
  nightTint();
}

function drawCamStore(){
  const g=ctx.createLinearGradient(0,0,0,CH);
  g.addColorStop(0,'#252028');g.addColorStop(1,'#0e0a12');
  ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);
  // стены и подиум
  ctx.fillStyle='#3a3040';ctx.fillRect(0,300,CW,30);
  ctx.fillStyle='#1a1418';ctx.fillRect(0,330,CW,CH-330);
  // полки одежды (вешалки)
  for(let i=0;i<5;i++){
    const x=80+i*160;
    ctx.fillStyle='#5a3a18';ctx.fillRect(x-50,80,100,8); // штанга
    ctx.fillStyle='#aaa';
    for(let j=0;j<4;j++){ctx.fillRect(x-45+j*22,80,3,30);}
    // одежда
    ctx.fillStyle=['#c84','#48c','#9c8','#c48','#4cc'][i%5];
    ctx.fillRect(x-48,110,96,80);
  }
  // манекены
  ctx.font='80px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🧍',200,360);ctx.fillText('🧍',680,360);
  // касса
  ctx.fillStyle='#5a3018';ctx.fillRect(380,360,120,50);
  ctx.fillStyle='#222';ctx.fillRect(420,350,40,20);

  drawAnomaliesForCam(1);
  nightTint();
}

function drawCamCafe(){
  const g=ctx.createLinearGradient(0,0,0,CH);
  g.addColorStop(0,'#1a1a14');g.addColorStop(1,'#0a0a07');
  ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);
  // стойка бара
  ctx.fillStyle='#5a3a18';ctx.fillRect(0,200,CW,30);
  ctx.fillStyle='#3a2010';ctx.fillRect(0,230,CW,30);
  // полка с бутылками
  ctx.fillStyle='#2a1a0a';ctx.fillRect(0,60,CW,140);
  ctx.fillStyle='#5a3a18';
  for(let i=0;i<3;i++) ctx.fillRect(0,80+i*40,CW,4);
  ctx.font='28px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ['🥤','☕','🥤','🍷','🥤','🍵','🥤','🍶','🥤','🍷'].forEach((e,i)=>{
    ctx.fillText(e,50+i*85,100);
  });
  // столики
  ctx.fillStyle='#3a2010';
  ctx.beginPath();ctx.ellipse(150,400,55,18,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(440,400,55,18,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(730,400,55,18,0,0,7);ctx.fill();
  // стулья
  ctx.font='30px serif';
  ctx.fillText('🪑',150,360);ctx.fillText('🪑',440,360);ctx.fillText('🪑',730,360);
  // кофемашина
  ctx.fillStyle='#444';ctx.fillRect(60,160,80,40);
  ctx.font='22px serif';ctx.fillText('☕',100,180);

  drawAnomaliesForCam(2);
  nightTint();
}

function drawCamStairs(){
  const g=ctx.createLinearGradient(0,0,0,CH);
  g.addColorStop(0,'#0e1a22');g.addColorStop(1,'#040a10');
  ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);
  // ступени по диагонали
  ctx.fillStyle='#2a3540';
  for(let i=0;i<14;i++){
    const y=80+i*26;
    ctx.fillRect(300-i*15,y,300+i*30,18);
    ctx.fillStyle = i%2===0?'#3a4550':'#2a3540';
  }
  // перила
  ctx.strokeStyle='#7a8a99';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(60,440);ctx.lineTo(360,40);ctx.stroke();
  ctx.beginPath();ctx.moveTo(820,440);ctx.lineTo(520,40);ctx.stroke();
  // знак выхода
  ctx.fillStyle='#22a040';ctx.fillRect(60,40,100,40);
  ctx.fillStyle='#fff';ctx.font='20px Orbitron';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('EXIT',110,60);
  // огнетушитель
  ctx.font='30px serif';ctx.fillText('🧯',60,200);

  drawAnomaliesForCam(3);
  nightTint();
}

function drawCamWarehouse(){
  const g=ctx.createLinearGradient(0,0,0,CH);
  g.addColorStop(0,'#181818');g.addColorStop(1,'#080808');
  ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);
  // стеллажи
  ctx.fillStyle='#3a3028';
  for(let i=0;i<3;i++){
    const x=60+i*280;
    ctx.fillRect(x,80,200,300);
    // полки
    ctx.fillStyle='#1a1410';
    for(let j=0;j<4;j++) ctx.fillRect(x+5,120+j*70,190,5);
    // коробки
    ctx.fillStyle='#8a6030';
    for(let j=0;j<4;j++){
      for(let k=0;k<3;k++){
        ctx.fillRect(x+10+k*60,90+j*70,50,28);
      }
    }
    ctx.fillStyle='#3a3028';
  }
  // лампа сверху мигает
  const flick=Math.floor(Date.now()/200)%5===0?0.3:1;
  ctx.fillStyle=`rgba(255,240,180,${0.3*flick})`;
  ctx.beginPath();ctx.arc(440,40,80,0,7);ctx.fill();
  ctx.font='30px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('💡',440,30);

  drawAnomaliesForCam(4);
  nightTint();
}

// ============ АНОМАЛИИ — отрисовка на камерах ============
function drawAnomaliesForCam(camIdx){
  const list=anomalies.filter(a=>a.camIdx===camIdx);
  list.forEach(a=>{
    // глитч-экран: если на этой камере есть тип glitch — рисуем помехи
    if(a.type==='glitch'){
      drawGlitchOverlay();
    } else if(a.type==='sound'){
      // звук/шум — видимо как пульсирующая иконка волны в углу или вспышки
      const t=Math.sin(Date.now()/120)*0.5+0.5;
      ctx.fillStyle=`rgba(255,200,60,${0.3+0.4*t})`;
      ctx.beginPath();ctx.arc(40,40,18+t*8,0,7);ctx.fill();
      ctx.font='26px serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('🔊',40,40);
    } else if(a.type==='extra'){
      // лишний объект — спавним необычный предмет
      ctx.font='40px serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(a.icon||'❓', a.x, a.y);
    } else if(a.type==='intruder'){
      // чужой — человек или монстр (мигает чуть)
      ctx.font='52px serif';ctx.textAlign='center';ctx.textBaseline='middle';
      const t=Math.sin(Date.now()/250)*0.5+0.5;
      ctx.globalAlpha=0.55+0.45*t;
      ctx.fillText(a.icon||'👤', a.x, a.y);
      ctx.globalAlpha=1;
    } else if(a.type==='change'){
      // изменение объекта — рисуем альтернативный объект
      ctx.font='44px serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(a.icon||'🔄', a.x, a.y);
    } else if(a.type==='move'){
      // движение — что-то едет по экрану
      a.mx = (a.mx||a.x);
      a.mx += a.dir*0.7;
      if(a.mx>CW+50) a.mx=-50;
      if(a.mx<-50) a.mx=CW+50;
      ctx.font='40px serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(a.icon||'⚽', a.mx, a.y);
    }
  });
}

function drawGlitchOverlay(){
  // помехи: цветные полосы
  const stripes=8;
  for(let i=0;i<stripes;i++){
    const y=Math.random()*CH;
    const h=4+Math.random()*30;
    ctx.fillStyle=`rgba(${Math.random()*255|0},${Math.random()*255|0},${Math.random()*255|0},.25)`;
    ctx.fillRect(0,y,CW,h);
  }
  // шум
  for(let i=0;i<200;i++){
    ctx.fillStyle=Math.random()<0.5?'rgba(0,0,0,.5)':'rgba(255,255,255,.4)';
    ctx.fillRect(Math.random()*CW,Math.random()*CH,2,2);
  }
}

// ============ СОЗДАНИЕ АНОМАЛИЙ ============
const ANOMALY_TEMPLATES={

  // позиции согласованы с камерами
  0:[ // ENTRANCE

  ],
  1:[ // STORE
    {type:'extra', icon:'🎈', x:440, y:240},

  ],

    {type:'extra', icon:'🍕', x:150, y:390},
    {type:'intruder', icon:'🧛', x:730, y:340},
    {type:'intruder', icon:'👤', x:440, y:340},

  ],

    {type:'extra', icon:'🩸', x:440, y:300},
    {type:'extra', icon:'💼', x:300, y:360},

    {type:'intruder', icon:'🧟', x:300, y:200},
    {type:'change', icon:'🚫', x:110, y:60},

  ],

    {type:'extra', icon:'💀', x:440, y:200},

    {type:'intruder', icon:'👤', x:600, y:300},

    {type:'move', icon:'📦', y:400, dir:-1},
    {type:'sound'}, {type:'glitch'}
  ]
};

function spawnAnomaly(){
  // выбираем камеру и тип, но не больше одной аномалии одного типа на камере
  const camIdx=Math.floor(Math.random()*5);
  const templates=ANOMALY_TEMPLATES[camIdx];
  // отбираем такие, которых ещё нет на этой камере
  const existing=anomalies.filter(a=>a.camIdx===camIdx);
  const candidates=templates.filter(t=>!existing.some(a=>a.type===t.type));
  if(candidates.length===0) return;
  const tpl=candidates[Math.floor(Math.random()*candidates.length)];
  const an={camIdx, type:tpl.type, icon:tpl.icon, x:tpl.x, y:tpl.y, dir:tpl.dir, since:gameTime};
  anomalies.push(an);
  updateCamButtons();
  checkActive();
}

function updateCamButtons(){
  // никаких подсказок — игрок сам ищет
}

// ============ ОТМЕТКА АНОМАЛИИ ============
reportBtn.onclick=()=>{
  openTypeModal();
};
function openTypeModal(){
  sfxClick();
  curCamLabel.textContent='КАМЕРА: '+CAMS[curCam].short;
  typeGrid.innerHTML='';
  ANOMALY_TYPES.forEach(t=>{
    const b=document.createElement('button');
    b.className='typeBtn';
    b.innerHTML=`<div class="icon">${t.icon}</div>${t.name}`;
    b.onclick=()=>submitReport(t.id);
    typeGrid.appendChild(b);
  });
  typeModal.classList.add('show');
}
function closeTypeModal(){typeModal.classList.remove('show');}
document.getElementById('cancelBtn').onclick=closeTypeModal;

function showToast(text, ok){
  const t=document.getElementById('toast');
  t.textContent=text;
  t.classList.toggle('ok', !!ok);
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm=setTimeout(()=>t.classList.remove('show'),1600);
}

function submitReport(typeId){
  closeTypeModal();
  const idx=anomalies.findIndex(a=>a.camIdx===curCam && a.type===typeId);
  if(idx>=0){
    anomalies.splice(idx,1);
    sfxCorrect();
    showToast('АНОМАЛИЯ ЗАФИКСИРОВАНА', true);
    updateCamButtons();
    checkActive();
  } else {
    sfxWrong();
    showToast('АНОМАЛИЯ НЕ НАЙДЕНА', false);
    flashWrong();
  }
}

function flashWrong(){
  reportBtn.style.background='#922';
  setTimeout(()=>reportBtn.style.background='',300);
}

// ============ ПРОВЕРКА АКТИВНЫХ ============
function checkActive(){
  const n=anomalies.length;
  if(n>=2 && !warned){
    warned=true;
    warnOverlay.classList.add('show');
    sfxWarn();
    clearTimeout(warnTimer);
    warnTimer=setTimeout(()=>{
      warnOverlay.classList.remove('show');
    }, 3000);
  }
  if(n<2 && warned){
    warned=false;
    warnOverlay.classList.remove('show');
    clearTimeout(warnTimer);
  }
  if(n>=4){
    triggerScream();
  }
}
let warnTimer=null;

function triggerScream(){
  stage='dead';
  stopHum();
  warnOverlay.classList.remove('show');
  sfxScream();
  screamerEl.classList.add('show');
  setTimeout(()=>{
    screamerEl.classList.remove('show');
    showGameOver();
  }, 1600);
}

// ============ ПЕРЕКЛЮЧЕНИЕ КАМЕР ============
camBtns.forEach((b,i)=>{
  b.onclick=()=>switchCam(i);
});
function switchCam(i){
  if(stage!=='playing')return;
  if(curCam===i)return;
  curCam=i;
  camBtns.forEach((b,j)=>b.classList.toggle('active',j===i));
  camLabel.textContent=CAMS[i].name;
  sfxClick();
}
document.addEventListener('keydown',e=>{
  if(stage!=='playing')return;
  const k=e.code;
  if(k==='Digit1')switchCam(0);
  else if(k==='Digit2')switchCam(1);
  else if(k==='Digit3')switchCam(2);
  else if(k==='Digit4')switchCam(3);
  else if(k==='Digit5')switchCam(4);
  else if(k==='Space'){e.preventDefault();openTypeModal();}
});

// ============ ОСНОВНОЙ ЦИКЛ ============
function update(dt){
  // время
  const real=(performance.now()-gameStartReal)/1000;
  gameTime = real * (TOTAL_HOURS / (HOUR_DURATION*TOTAL_HOURS / 3600));
  // часы игрового времени
  const totalGameSeconds = (real/HOUR_DURATION)*3600; // 1 час = HOUR_DURATION реальных секунд
  const hh=Math.floor(totalGameSeconds/3600);
  const mm=Math.floor((totalGameSeconds%3600)/60);
  timeBox.textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
  if(hh>=TOTAL_HOURS){winGame();return;}

  // спавн новых аномалий: чем позже ночь — тем чаще
  nextAnomalyTimer-=dt;
  if(nextAnomalyTimer<=0 && anomalies.length<4){
    spawnAnomaly();
    // частота зависит от часа: 1й час — каждые 22с, 6й — каждые 9с
    const intervalBase = 22 - (hh*2.2);
    nextAnomalyTimer = Math.max(8, intervalBase) + Math.random()*5;
  }
}

let lastTime=0;
function loop(){
  if(stage!=='playing')return;
  const now=performance.now();
  const dt=Math.min(0.1,(now-lastTime)/1000);
  lastTime=now;
  update(dt);
  // рисуем текущую камеру
  ctx.clearRect(0,0,CW,CH);
  CAMS[curCam].draw();
  requestAnimationFrame(loop);
}

// ============ ЭКРАНЫ ============
function startGame(){
  stage='playing';
  curCam=0;anomalies=[];warned=false;
  nextAnomalyTimer=12;
  gameStartReal=performance.now();
  lastTime=gameStartReal;
  camBtns.forEach((b,i)=>{b.classList.toggle('active',i===0);b.classList.remove('has-alert');});
  camLabel.textContent=CAMS[0].name;
  warnOverlay.classList.remove('show');
  screen.classList.add('hidden');
  startHum();
  loop();
}

function winGame(){
  stage='win';
  stopHum();
  sfxWin();
  screen.innerHTML=`<h1>06:00 — РАССВЕТ</h1>
    <h2>смена окончена</h2>
    <div style="font-size:90px;text-shadow:0 0 30px #fc6;">☀️</div>
    <p style="color:#fc6;font-size:18px;letter-spacing:2px;">ТЫ ВЫЖИЛ!</p>
    <p>Ты успешно отработал всю смену с 00:00 до 06:00.<br>Активных аномалий: <b>${anomalies.length}</b></p>
    <button class="btn" id="again">ЕЩЁ ОДНА СМЕНА</button>`;
  screen.classList.remove('hidden');
  document.getElementById('again').onclick=startGame;
}

function showGameOver(){
  stage='dead';
  stopHum();
  screen.innerHTML=`<h1 style="color:#ff3322;text-shadow:0 0 30px #ff0000;">GAME OVER</h1>
    <div style="font-size:90px;text-shadow:0 0 30px #ff3322;">💀</div>
    <p style="color:#ff8866;font-size:18px;letter-spacing:2px;">АНОМАЛИИ ПРОРВАЛИСЬ</p>
    <p>Ты допустил <b>4 активные аномалии</b>.<br>Они нашли тебя.</p>
    <button class="btn dead" id="again">ПОПРОБОВАТЬ СНОВА</button>`;
  screen.classList.remove('hidden');
  document.getElementById('again').onclick=startGame;
}

function showMenu(){
  stage='menu';
  stopHum();
  screen.innerHTML=`<h1>СМЕНА ОХРАНЫ</h1>
    <h2>торговый центр • ночь</h2>
    <p>Ты ночной охранник торгового центра. Следи за <b>5 камерами</b> и фиксируй аномалии.<br>Продержись с <b>00:00 до 06:00</b> (1 игровой час = 5 реальных минут).</p>
    <p style="font-size:13px;color:#9ab;">
      <span class="key">1-5</span> — переключение камер &nbsp; <span class="key">мышь</span> — кнопки<br>
      <span class="key">ОТМЕТИТЬ АНОМАЛИЮ</span> или <span class="key">пробел</span> — открыть меню типа<br>
      Аномалии: движение, лишний объект, чужой, неисправность, звук, изменение.<br>
      ⚠ <b>2 активные</b> = предупреждение &nbsp; 💀 <b>4 активные</b> = СКРИМЕР И КОНЕЦ
    </p>
    <button class="btn" id="start">НАЧАТЬ СМЕНУ</button>`;
  screen.classList.remove('hidden');
  document.getElementById('start').onclick=startGame;
}

// первый рендер кадра камеры — превью на меню
CAMS[0].draw();
showMenu();
</script>
