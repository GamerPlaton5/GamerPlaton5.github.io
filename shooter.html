<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МЕТКИЙ СТРЕЛОК</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Russo+One&family=Orbitron:wght@600;800;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;}
  body{font-family:'Russo One',sans-serif;background:#1a0f06;min-height:100vh;
    display:flex;align-items:center;justify-content:center;overflow:hidden;}
  #wrap{position:relative;width:820px;max-width:97vw;height:540px;max-height:88vh;
    border-radius:14px;overflow:hidden;background:#000;
    box-shadow:0 0 70px rgba(220,150,60,.4);cursor:crosshair;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  #hud{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;
    justify-content:space-between;padding:10px 18px;color:#ffd060;font-family:'Orbitron';
    font-weight:800;font-size:17px;letter-spacing:1px;text-shadow:0 0 8px #884400,0 0 3px #000;
    background:linear-gradient(180deg,rgba(0,0,0,.5),transparent);pointer-events:none;}
  #hud .red{color:#ff5544;}
  #hud .green{color:#22e090;}
  #waveTop{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:5;
    color:#fc6;font-family:'Orbitron';font-size:14px;letter-spacing:3px;
    background:rgba(0,0,0,.5);padding:3px 14px;border-radius:4px;pointer-events:none;
    text-shadow:0 0 8px #000;}
  #banner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:8;
    color:#fff;font-family:'Orbitron';font-size:46px;font-weight:900;letter-spacing:5px;
    text-shadow:0 0 30px #ff8800;opacity:0;pointer-events:none;transition:opacity .4s;}
  #banner.show{opacity:1;}
  #screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;color:#cde;padding:30px;
    background:radial-gradient(ellipse at center,#3a1a08 0%,#08040a 70%);}
  #screen.hidden{display:none;}
  h1{font-size:54px;color:#ffaa44;text-shadow:0 0 30px #ff6020;margin-bottom:8px;letter-spacing:5px;font-family:'Orbitron';}
  h2{font-size:18px;color:#fc9;letter-spacing:3px;margin-bottom:18px;font-family:'Orbitron';}
  p{font-size:15px;line-height:1.8;margin-bottom:14px;color:#dcb;max-width:580px;}
  .key{background:#241510;border:1px solid #b88040;border-radius:4px;padding:2px 9px;color:#fcb070;font-family:'Russo One';}
  .btn{background:linear-gradient(135deg,#ff8822,#cc4400);color:#fff;border:none;
    border-radius:6px;padding:14px 46px;font-family:'Orbitron';font-size:20px;font-weight:900;
    letter-spacing:3px;cursor:pointer;box-shadow:0 0 28px rgba(255,120,40,.55);text-transform:uppercase;}
  .btn:active{transform:scale(.96);}
  .legend{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 24px;margin:12px 0;}
  .legend div{font-size:14px;color:#dcb;text-align:left;}
  .legend b{color:#fc9;}
  .record{color:#ffd060;font-size:18px;margin-top:10px;font-family:'Orbitron';}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="820" height="540"></canvas>
  <div id="waveTop">ВОЛНА 1</div>
  <div id="hud">
    <div>🎯 ОЧКИ: <span id="score">0</span></div>
    <div class="green">⏱ <span id="time">50</span></div>
  </div>
  <div id="banner"></div>
  <div id="screen"></div>
</div>
<script>
'use strict';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),
      comboEl=document.getElementById('combo'),comboMulEl=document.getElementById('comboMul'),
      missedEl=document.getElementById('missed'),waveTop=document.getElementById('waveTop'),
      banner=document.getElementById('banner'),screen=document.getElementById('screen');

// ============ АУДИО ============
let audioCtx=null;
function initAudio(){if(audioCtx)return;try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){audioCtx=null;}}
function tone(f,dur,type='square',vol=0.14,when=0){
  if(!audioCtx)return;
  const t=audioCtx.currentTime+when;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+0.02);
}
function sfxShoot(){initAudio();
  if(!audioCtx)return;
  const t=audioCtx.currentTime;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(900,t);
  o.frequency.exponentialRampToValueAtTime(80,t+0.08);
  g.gain.setValueAtTime(0.16,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.1);
  o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+0.12);
}
function sfxHit(){initAudio();tone(880,0.08,'triangle',0.15);tone(1320,0.1,'triangle',0.12,0.04);}
function sfxBonus(){initAudio();[523,659,784,1046].forEach((n,i)=>tone(n,0.1,'triangle',0.16,i*0.06));}
function sfxBad(){initAudio();tone(220,0.2,'sawtooth',0.18);tone(180,0.2,'sawtooth',0.15,0.08);}
function sfxMiss(){initAudio();tone(150,0.08,'sine',0.10);}
function sfxWaveDone(){initAudio();[659,784,988].forEach((n,i)=>tone(n,0.15,'triangle',0.18,i*0.08));}
function sfxGameOver(){initAudio();[523,440,349,294,247].forEach((n,i)=>tone(n,0.25,'sawtooth',0.16,i*0.18));}

// фоновая музыка — драйвовая
let musicGain=null,musicOn=false,musicTimer=null,musicIdx=0;
const BG=[
  {bass:130.81, mel:[659,0,659,587,523,0,440,494]},
  {bass:174.61, mel:[523,0,587,659,587,0,523,440]},
  {bass:196.00, mel:[587,0,659,784,659,0,587,523]},
  {bass:130.81, mel:[440,494,523,587,659,587,523,440]}
];
function mn(f,when,dur,vol){
  if(!audioCtx||!musicGain)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='square';o.frequency.setValueAtTime(f,when);
  g.gain.setValueAtTime(0.0001,when);
  g.gain.exponentialRampToValueAtTime(vol,when+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,when+dur);
  o.connect(g);g.connect(musicGain);o.start(when);o.stop(when+dur+0.02);
}
function kick(when){
  if(!audioCtx||!musicGain)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='sine';o.frequency.setValueAtTime(140,when);
  o.frequency.exponentialRampToValueAtTime(40,when+0.12);
  g.gain.setValueAtTime(0.3,when);g.gain.exponentialRampToValueAtTime(0.0001,when+0.15);
  o.connect(g);g.connect(musicGain);o.start(when);o.stop(when+0.18);
}
function scheduleBar(when){
  if(!musicOn||!audioCtx)return;
  const bar=BG[musicIdx%BG.length];const beat=0.25;
  mn(bar.bass,when,1.9,0.12);
  kick(when);kick(when+beat*2);kick(when+beat*4);kick(when+beat*6);
  for(let i=0;i<8;i++){const f=bar.mel[i];if(f>0) mn(f,when+beat*i,beat*0.85,0.06);}
  musicIdx++;
}
function musicLoop(){
  if(!musicOn||!audioCtx)return;
  const now=audioCtx.currentTime;
  scheduleBar(now+0.05);scheduleBar(now+2.05);
  musicTimer=setTimeout(musicLoop,4000);
}
function startMusic(){
  initAudio();if(!audioCtx)return;if(audioCtx.state==='suspended')audioCtx.resume();
  if(musicOn)return;
  if(!musicGain){musicGain=audioCtx.createGain();musicGain.gain.value=0.4;musicGain.connect(audioCtx.destination);}
  musicOn=true;musicIdx=0;musicLoop();
}
function stopMusic(){musicOn=false;if(musicTimer){clearTimeout(musicTimer);musicTimer=null;}}

// ============ ТИПЫ МИШЕНЕЙ ============
const TARGETS={
  basic:   {emoji:'🎯', score:10,  rMin:20,rMax:34, life:6.5, color:'#fc6', vmin:0,vmax:0,    chance:0.55},
  small:   {emoji:'🎯', score:25,  rMin:12,rMax:16, life:6.0, color:'#fa6', vmin:0,vmax:0,    chance:0.2},
  fast:    {emoji:'🦅', score:30,  rMin:22,rMax:28, life:7.5, color:'#7df', vmin:2.5,vmax:4,  chance:0.10, type:'fast'},
  bonus:   {emoji:'⭐', score:50,  rMin:24,rMax:30, life:5.0, color:'#fd2', vmin:0,vmax:0,    chance:0.08, type:'bonus'},
  bomb:    {emoji:'💣', score:-30, rMin:24,rMax:30, life:6.5, color:'#f44', vmin:0,vmax:0,    chance:0.07, type:'bomb'}
};

// ============ СОСТОЯНИЕ ============
let stage='menu', score=0, combo=0, missed=0, wave=1, waveTimer=0, time=30;
let gameStartTime=0;
const GAME_DURATION=50; // ровно 50 секунд игры
let targets=[], hits=[], particles=[];
let mouseX=W/2, mouseY=H/2, record=0;
const MAX_MISSED=5;

function comboMul(){
  return 1; // серии отключены
}
function updHud(){
  scoreEl.textContent=score;
  timeEl.textContent=Math.ceil(time);
  waveTop.textContent='🎯 ЦЕЛЬ: 1000';
}

cv.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect();
  mouseX=(e.clientX-r.left)*(W/r.width);
  mouseY=(e.clientY-r.top)*(H/r.height);
});
cv.addEventListener('mousedown',e=>{
  if(stage!=='playing')return;
  shoot(mouseX,mouseY);
});
// тач: тап = прицел + выстрел в точку касания
cv.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.touches[0];if(!t)return;
  const r=cv.getBoundingClientRect();
  mouseX=(t.clientX-r.left)*(W/r.width);
  mouseY=(t.clientY-r.top)*(H/r.height);
  if(stage==='playing') shoot(mouseX,mouseY);
},{passive:false});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  const t=e.touches[0];if(!t)return;
  const r=cv.getBoundingClientRect();
  mouseX=(t.clientX-r.left)*(W/r.width);
  mouseY=(t.clientY-r.top)*(H/r.height);
},{passive:false});

function shoot(x,y){
  sfxShoot();
  hits.push({x,y,life:8,hit:false});
  // ищем самую близкую мишень в радиусе клика
  let best=null,bd=99999;
  targets.forEach(t=>{
    if(t.dying)return;
    const d=Math.hypot(t.x-x,t.y-y);
    if(d<t.r && d<bd){best=t;bd=d;}
  });
  if(best){
    hits[hits.length-1].hit=true;
    onHit(best,x,y);
  } else {
    sfxMiss();
    updHud();
  }
}

function onHit(t,x,y){
  if(t.type==='bomb'){
    sfxBad();
    flashScreen('#ff3322');
    burst(t.x,t.y,'#ff4422',30);
    t.dying=true;t.dyAnim=10;
    loseBomb();
    return;
  } else if(t.type==='bonus'){
    score+=t.score;
    sfxBonus();
    burst(t.x,t.y,'#ffd040',20);
  } else {
    score+=t.score;
    sfxHit();
    burst(t.x,t.y,t.color,10);
  }
  t.dying=true; t.dyAnim=10;
  updHud();
}

function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=Math.random()*4+1;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:30,color});
  }
}

function flashScreen(color){
  const overlay=ctx.fillStyle;
  // короткая красная вспышка — реализуем в render через переменную
  flashColor=color;flashAlpha=0.5;
}
let flashColor='#000',flashAlpha=0;

// ============ СПАВН ============
function spawnTarget(){
  // выбираем тип по шансам
  const r=Math.random(); let cum=0, sel='basic';
  for(const k in TARGETS){cum+=TARGETS[k].chance;if(r<cum){sel=k;break;}}
  const T=TARGETS[sel];
  const radius=T.rMin+Math.random()*(T.rMax-T.rMin);
  const margin=radius+20;
  const x=margin+Math.random()*(W-margin*2);
  const y=margin+30+Math.random()*(H-margin*2-30);
  const speed=T.vmin+Math.random()*(T.vmax-T.vmin);
  const dir=Math.random()*Math.PI*2;
  targets.push({
    x,y,r:radius,emoji:T.emoji,color:T.color,score:T.score,type:T.type||'basic',
    life:T.life*60, maxLife:T.life*60,
    vx:Math.cos(dir)*speed, vy:Math.sin(dir)*speed,
    dying:false, dyAnim:0,
    spin:Math.random()*Math.PI*2
  });
}

let spawnTimer=0;
function update(){
  // одна сессия — ровно 60 секунд реального времени
  const now=performance.now();
  if(!gameStartTime) gameStartTime=now;
  const elapsed=(now-gameStartTime)/1000;
  time=Math.max(0, GAME_DURATION-elapsed);
  if(time<=0){
    endRound();
    return;
  }

  // спавн мишеней — меньше штук и реже
  spawnTimer--;
  const spawnEvery = 90; // спокойнее темп
  if(spawnTimer<=0 && targets.filter(t=>!t.dying).length < 4){
    spawnTarget();
    spawnTimer=spawnEvery;
  }

  // обновляем мишени
  targets.forEach(t=>{
    if(t.dying){t.dyAnim--;return;}
    t.x+=t.vx; t.y+=t.vy;
    t.spin+=0.05;
    if(t.x<t.r+5||t.x>W-t.r-5)t.vx*=-1;
    if(t.y<t.r+35||t.y>H-t.r-5)t.vy*=-1;
    t.life--;
    if(t.life<=0){
      if(t.type!=='bomb') {missed++; sfxMiss();}
      t.dying=true; t.dyAnim=0;
    }
  });
  targets=targets.filter(t=>!(t.dying&&t.dyAnim<=0));

  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=0.95;p.vy*=0.95;p.life--;});
  particles=particles.filter(p=>p.life>0);

  hits.forEach(h=>h.life--);
  hits=hits.filter(h=>h.life>0);

  if(flashAlpha>0) flashAlpha-=0.04;

  updHud();
}

function nextWave(){
  wave++; time=30;
  sfxWaveDone();
  showBanner('ВОЛНА '+wave,'#fc6');
  updHud();
}

function showBanner(text,color){
  banner.textContent=text;
  banner.style.color=color||'#fff';
  banner.style.opacity=1;
  setTimeout(()=>banner.style.opacity=0,1300);
}

// ============ РЕНДЕР ============
function render(){
  // фон тира
  drawBackground();

  // мишени
  targets.forEach(t=>{
    if(t.dying){
      // анимация исчезновения
      const k=t.dyAnim/10;
      ctx.globalAlpha=k;
      ctx.font=(t.r*2.4)+'px serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(t.emoji, t.x, t.y);
      ctx.globalAlpha=1;
      return;
    }
    // рисуем "круглую мишень" под эмодзи для basic/small
    if(t.type==='basic'||t.type==='small'||t.type==='fast'){
      ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,7);
      ctx.fillStyle=t.color;ctx.fill();
      ctx.beginPath();ctx.arc(t.x,t.y,t.r*0.7,0,7);
      ctx.fillStyle='#fff';ctx.fill();
      ctx.beginPath();ctx.arc(t.x,t.y,t.r*0.45,0,7);
      ctx.fillStyle=t.color;ctx.fill();
      ctx.beginPath();ctx.arc(t.x,t.y,t.r*0.2,0,7);
      ctx.fillStyle='#222';ctx.fill();
      if(t.type==='fast'){
        // у летящих — иконка птички сверху
        ctx.font='22px serif';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('🦅',t.x,t.y);
      }
    } else if(t.type==='bonus'){
      ctx.save();ctx.translate(t.x,t.y);ctx.rotate(t.spin);
      ctx.font=(t.r*2)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.shadowColor='#ffd040';ctx.shadowBlur=20;
      ctx.fillText('⭐',0,0);
      ctx.restore();ctx.shadowBlur=0;
    } else if(t.type==='bomb'){
      ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,7);
      ctx.fillStyle='rgba(255,40,40,.25)';ctx.fill();
      ctx.font=(t.r*1.8)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('💣',t.x,t.y);
    }
    // полоска жизни (исчезновения) под мишенью
    const bw=t.r*1.6;
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(t.x-bw/2,t.y+t.r+4,bw,3);
    ctx.fillStyle = t.type==='bomb'?'#ff3322':(t.type==='bonus'?'#ffd040':'#22dd44');
    ctx.fillRect(t.x-bw/2,t.y+t.r+4,bw*(t.life/t.maxLife),3);
  });

  // частицы
  particles.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life/30);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,4,4);
  });
  ctx.globalAlpha=1;

  // вспышки выстрелов (попадание/промах)
  hits.forEach(h=>{
    ctx.globalAlpha=h.life/8;
    ctx.strokeStyle=h.hit?'#22dd44':'#ff3322';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(h.x,h.y,12+8*(1-h.life/8),0,7);ctx.stroke();
  });
  ctx.globalAlpha=1;

  // прицел
  drawCrosshair(mouseX,mouseY);

  // эффект вспышки экрана
  if(flashAlpha>0){
    ctx.fillStyle=flashColor;
    ctx.globalAlpha=Math.max(0,flashAlpha);
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
  }
}

function drawBackground(){
  // тир: задний фон с горами и землёй
  const sky=ctx.createLinearGradient(0,0,0,H*0.6);
  sky.addColorStop(0,'#3a2010');sky.addColorStop(1,'#7a4020');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // далёкие горы
  ctx.fillStyle='#4a2a15';
  ctx.beginPath();
  ctx.moveTo(0,H*0.5);
  for(let i=0;i<=10;i++){
    const x=W*i/10, y=H*(0.4+Math.sin(i*1.3)*0.06);
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,H*0.5);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  // ближние горы
  ctx.fillStyle='#2a1408';
  ctx.beginPath();
  ctx.moveTo(0,H*0.65);
  for(let i=0;i<=8;i++){
    const x=W*i/8, y=H*(0.55+Math.sin(i*2)*0.08);
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,H*0.65);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  // земля
  ctx.fillStyle='#1a0a04';ctx.fillRect(0,H*0.78,W,H*0.22);
  // мишенные столбики — декорации внизу
  ctx.fillStyle='#6a4020';
  for(let i=0;i<5;i++){
    const x=80+i*150;
    ctx.fillRect(x,H-50,8,40);
  }
}

function drawCrosshair(x,y){
  ctx.strokeStyle='rgba(255,220,80,0.9)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(x,y,14,0,7);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-22,y);ctx.lineTo(x-8,y);ctx.moveTo(x+8,y);ctx.lineTo(x+22,y);
  ctx.moveTo(x,y-22);ctx.lineTo(x,y-8);ctx.moveTo(x,y+8);ctx.lineTo(x,y+22);ctx.stroke();
  ctx.fillStyle='rgba(255,220,80,0.9)';
  ctx.beginPath();ctx.arc(x,y,2,0,7);ctx.fill();
}

function loop(){
  if(stage==='playing'){update();render();}
  requestAnimationFrame(loop);
}

// ============ КОНЕЦ ============
function endRound(){
  stage='gameover';
  stopMusic();
  if(score>record){record=score;try{localStorage.setItem('shooterRecord',record);}catch(e){}}
  let title, sub, emoji, color;
  if(score>=1000){     title='🏆 ЧЕМПИОН!';        sub='Невероятная меткость!';   emoji='🏆'; color='#ffd060'; sfxWaveDone();sfxWaveDone();}
  else if(score>=751){ title='🔥 РЕСПЕКТ';         sub='Очень круто!';             emoji='🔥'; color='#ff8844'; sfxWaveDone();}
  else if(score>=401){ title='👍 МОЛОДЕЦ';         sub='Хороший результат!';       emoji='👍'; color='#66dd66'; sfxHit();}
  else if(score>=201){ title='🙂 НЕПЛОХО';         sub='Можешь лучше!';            emoji='🙂'; color='#aaccff';}
  else {               title='🎯 СТРЕЛЯЙ ЧЁТЧЕ';   sub='Тренируйся ещё!';          emoji='😅'; color='#aaaaaa'; sfxGameOver();}
  screen.innerHTML=`<h1 style="color:${color};text-shadow:0 0 30px ${color};">${title}</h1>
    <div style="font-size:80px;text-shadow:0 0 30px ${color};">${emoji}</div>
    <p style="color:${color};font-size:18px;letter-spacing:2px;">${sub}</p>
    <p>Очки: <b>${score}</b> / 1000<br>Рекорд: <b>${record}</b></p>
    <button class="btn" id="again">ИГРАТЬ СНОВА</button>`;
  screen.classList.remove('hidden');
  document.getElementById('again').onclick=startGame;
}

function loseBomb(){
  stage='gameover';
  stopMusic();sfxGameOver();
  if(score>record){record=score;try{localStorage.setItem('shooterRecord',record);}catch(e){}}
  screen.innerHTML=`<h1>💥 БУМ!</h1>
    <p>Ты выстрелил в бомбу! Никогда больше так не делай 😅<br>Очки: <b>${score}</b><br>Рекорд: <b>${record}</b></p>
    <button class="btn" id="again">ЕЩЁ РАЗ</button>`;
  screen.classList.remove('hidden');
  document.getElementById('again').onclick=startGame;
}

function startGame(){
  stage='playing';
  score=0;combo=0;missed=0;wave=1;time=50;targets=[];hits=[];particles=[];spawnTimer=0;
  gameStartTime=0;
  updHud();
  screen.classList.add('hidden');
  startMusic();
  showBanner('50 СЕКУНД — 1000 ОЧКОВ!','#fc6');
}

function showMenu(){
  stage='menu';stopMusic();
  try{record=parseInt(localStorage.getItem('shooterRecord'))||0;}catch(e){record=0;}
  screen.innerHTML=`<h1>МЕТКИЙ СТРЕЛОК</h1>
    <h2>тир чемпионов</h2>
    <p>У тебя <b>50 секунд</b>. Набирай как можно больше очков!</p>
    <div class="legend">
      <div><b>🎯 Обычная</b>: 10 очков</div>
      <div><b>🎯 Малая</b>: 25 очков</div>
      <div><b>🦅 Летящая</b>: 30 очков</div>
      <div><b>⭐ Бонус</b>: 50 очков</div>
      <div><b>💣 Бомба</b>: <span style="color:#f55">НЕ СТРЕЛЯЙ!</span> взрыв = проигрыш</div>
      <div><b>🏆 ЦЕЛЬ</b>: 1000 очков = чемпион</div>
    </div>
    <p style="font-size:13px;color:#a98;"><span class="key">мышь</span> — целиться, <span class="key">ЛКМ</span> — стрелять</p>
    ${record>0?`<div class="record">Твой рекорд: ${record}</div>`:''}
    <button class="btn" id="start">НАЧАТЬ</button>`;
  screen.classList.remove('hidden');
  document.getElementById('start').onclick=startGame;
}

showMenu();
loop();
</script>
</body>
</html>
