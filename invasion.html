<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ВТОРЖЕНИЕ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Russo+One&family=Orbitron:wght@600;800;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;}
  body{font-family:'Russo One',sans-serif;background:#000;min-height:100vh;
    display:flex;align-items:center;justify-content:center;overflow:hidden;}
  #wrap{position:relative;width:820px;max-width:97vw;height:540px;max-height:86vh;
    border-radius:10px;overflow:hidden;background:#000;
    box-shadow:0 0 70px rgba(120,80,255,.45);cursor:crosshair;}
  canvas{display:block;width:100%;height:100%;}
  /* тач-управление */
  #touchControls{position:absolute;inset:0;z-index:8;pointer-events:none;}
  #joystick{position:absolute;left:20px;bottom:20px;width:120px;height:120px;
    border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);
    pointer-events:auto;touch-action:none;}
  #joyKnob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;
    background:rgba(120,200,255,.6);border:2px solid rgba(255,255,255,.5);}
  #fireBtn{position:absolute;right:24px;bottom:30px;width:90px;height:90px;border-radius:50%;
    background:rgba(255,80,60,.35);border:3px solid rgba(255,120,90,.7);
    display:flex;align-items:center;justify-content:center;font-size:40px;
    pointer-events:auto;touch-action:none;user-select:none;}
  #fireBtn:active{background:rgba(255,80,60,.6);}
  #hud{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;
    justify-content:space-between;padding:10px 18px;color:#9ff;font-size:18px;font-weight:700;
    letter-spacing:1px;text-shadow:0 0 8px #088,0 0 3px #000;font-family:'Orbitron',sans-serif;
    background:linear-gradient(180deg,rgba(0,0,0,.5),transparent);}
  #hud .red{color:#ff5566;text-shadow:0 0 8px #f00,0 0 3px #000;}
  #miss{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:5;
    color:#cfb;font-size:14px;font-family:'Orbitron';letter-spacing:2px;
    background:rgba(0,0,0,.45);padding:3px 12px;border-radius:4px;text-shadow:0 0 6px #000;pointer-events:none;}
  #flash{position:absolute;inset:0;z-index:3;background:#f00;opacity:0;pointer-events:none;transition:opacity .12s;}
  #screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;color:#cde;padding:30px;
    background:radial-gradient(ellipse at center,#0a0820 0%,#03020a 70%);}
  #screen.hidden{display:none;}
  h1{font-size:54px;color:#a070ff;text-shadow:0 0 32px #6020ff;margin-bottom:8px;letter-spacing:6px;
    font-family:'Orbitron',sans-serif;}
  h2{font-size:22px;color:#7dd;letter-spacing:3px;margin-bottom:18px;font-family:'Orbitron';}
  p{font-size:16px;line-height:1.8;margin-bottom:18px;color:#bcd;max-width:600px;}
  .key{background:#11183a;border:1px solid #4488ff;border-radius:4px;padding:2px 9px;color:#9cf;font-family:'Russo One';}
  .btn{background:linear-gradient(135deg,#7050ff,#3020aa);color:#fff;border:none;
    border-radius:6px;padding:14px 46px;font-family:'Orbitron';font-size:20px;font-weight:900;
    cursor:pointer;letter-spacing:3px;box-shadow:0 0 30px rgba(120,80,255,.6);text-transform:uppercase;margin-top:8px;}
  .btn:active{transform:scale(.96);}
  .dialog{display:flex;align-items:flex-start;gap:18px;text-align:left;
    background:rgba(20,18,46,.85);border:1px solid #3a3a88;border-radius:10px;
    padding:18px 22px;max-width:680px;margin-bottom:18px;}
  .dialog .avatar{font-size:54px;line-height:1;}
  .dialog .text{color:#cde;font-size:16px;line-height:1.55;}
  .dialog .name{color:#9af;font-family:'Orbitron';letter-spacing:1px;margin-bottom:4px;font-size:14px;}
  .nextHint{font-size:13px;color:#8ad;margin-top:8px;letter-spacing:1px;}
  .vsLabel{color:#fa8;font-family:'Orbitron';font-size:14px;letter-spacing:3px;margin-top:6px;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="820" height="540"></canvas>
  <div id="flash"></div>
  <div id="hud" style="display:none">
    <div class="red">❤ <span id="hp">100</span></div>
    <div><span id="wname">Пистолет</span> <span id="ammo">12</span>/<span id="reserve">36</span></div>
    <div>Врагов: <span id="left">0</span></div>
  </div>
  <div id="miss" style="display:none"></div>
  <div id="touchControls" style="display:none">
    <div id="joystick"><div id="joyKnob"></div></div>
    <div id="fireBtn">🔫</div>
  </div>
  <div id="screen"></div>
</div>
<script>
'use strict';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;

// ============ АУДИО (боевая музыка и звуки через Web Audio API) ============
let audioCtx=null, musicGain=null, musicTimer=null, musicOn=false;

function initAudio(){
  if(audioCtx)return;
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    musicGain=audioCtx.createGain();
    musicGain.gain.value=0.18;
    musicGain.connect(audioCtx.destination);
  }catch(e){audioCtx=null;}
}

function note(freq,when,dur,type='square',vol=0.18){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq,when);
  g.gain.setValueAtTime(0.0001,when);
  g.gain.exponentialRampToValueAtTime(vol,when+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,when+dur);
  o.connect(g);g.connect(musicGain);
  o.start(when);o.stop(when+dur+0.02);
}

function kick(when){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(150,when);
  o.frequency.exponentialRampToValueAtTime(40,when+0.15);
  g.gain.setValueAtTime(0.5,when);
  g.gain.exponentialRampToValueAtTime(0.0001,when+0.18);
  o.connect(g);g.connect(musicGain);
  o.start(when);o.stop(when+0.2);
}

function hatTick(when){
  if(!audioCtx)return;
  const bufSize=audioCtx.sampleRate*0.05;
  const buf=audioCtx.createBuffer(1,bufSize,audioCtx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) data[i]=(Math.random()*2-1)*Math.pow(1-i/bufSize,4);
  const src=audioCtx.createBufferSource();
  src.buffer=buf;
  const g=audioCtx.createGain();g.gain.value=0.12;
  src.connect(g);g.connect(musicGain);
  src.start(when);
}

// Боевая тема в Am: повторяющиеся такты с басом, кикaми, хэтами и мелодией
const MELODY=[
  // [тон_бас, мелодия 8 нот]  ноты: A=440 базовый
  // частоты:
  // A4=440 C5=523 D5=587 E5=659 F5=698 G5=784  A5=880
  // Бас A2=110, F2=87.31, G2=98, E2=82.41
  {bass:110, mel:[659,0,659,587,523,0,440,494]},
  {bass:87.31, mel:[523,0,523,587,659,0,587,523]},
  {bass:98, mel:[587,0,587,659,784,0,659,587]},
  {bass:82.41, mel:[440,0,494,523,587,659,587,523]}
];

let melodyIdx=0;
function scheduleBar(when){
  if(!musicOn||!audioCtx)return;
  const bar=MELODY[melodyIdx%MELODY.length];
  const beatLen=0.25; // 8 нот по 0.25с = 2 сек на такт
  // бас (длинный)
  note(bar.bass, when, 1.9, 'triangle', 0.22);
  note(bar.bass*2, when, 1.9, 'triangle', 0.06);
  // кики на 1, 3, 5, 7
  kick(when); kick(when+beatLen*2); kick(when+beatLen*4); kick(when+beatLen*6);
  // хэты между
  for(let i=0;i<8;i++) hatTick(when+beatLen*i+beatLen*0.5);
  // мелодия
  for(let i=0;i<8;i++){
    const f=bar.mel[i];
    if(f>0) note(f, when+beatLen*i, beatLen*0.9, 'square', 0.10);
  }
  melodyIdx++;
}

function musicLoop(){
  if(!musicOn||!audioCtx)return;
  const now=audioCtx.currentTime;
  scheduleBar(now+0.05);
  scheduleBar(now+2.05); // запас на следующий такт
  musicTimer=setTimeout(musicLoop, 4000); // каждые 2 такта планируем
}

function startMusic(){
  initAudio();
  if(!audioCtx)return;
  if(audioCtx.state==='suspended') audioCtx.resume();
  if(musicOn)return;
  musicOn=true; melodyIdx=0;
  musicLoop();
}
function stopMusic(){
  musicOn=false;
  if(musicTimer){clearTimeout(musicTimer);musicTimer=null;}
}

// SFX выстрел
function sfxShoot(){
  if(!audioCtx)return;
  const t=audioCtx.currentTime;
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.type='sawtooth';
  o.frequency.setValueAtTime(900,t);
  o.frequency.exponentialRampToValueAtTime(120,t+0.08);
  g.gain.setValueAtTime(0.18,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.1);
  o.connect(g);g.connect(audioCtx.destination);
  o.start(t);o.stop(t+0.12);
}
// SFX смерть врага
function sfxKill(){
  if(!audioCtx)return;
  const t=audioCtx.currentTime;
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.type='square';
  o.frequency.setValueAtTime(200,t);
  o.frequency.exponentialRampToValueAtTime(60,t+0.2);
  g.gain.setValueAtTime(0.22,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);
  o.connect(g);g.connect(audioCtx.destination);
  o.start(t);o.stop(t+0.3);
}
// SFX попадание по игроку
function sfxHurt(){
  if(!audioCtx)return;
  const t=audioCtx.currentTime;
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.type='sawtooth';
  o.frequency.setValueAtTime(180,t);
  o.frequency.exponentialRampToValueAtTime(60,t+0.15);
  g.gain.setValueAtTime(0.25,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
  o.connect(g);g.connect(audioCtx.destination);
  o.start(t);o.stop(t+0.22);
}

const hud=document.getElementById('hud'), miss=document.getElementById('miss');
const hpEl=document.getElementById('hp'),ammoEl=document.getElementById('ammo'),reserveEl=document.getElementById('reserve');
const leftEl=document.getElementById('left'),wnameEl=document.getElementById('wname');
const flashEl=document.getElementById('flash');
const screen=document.getElementById('screen');

// ============ ОРУЖИЕ ============
const WEAPONS={
  pistol:{name:'Пистолет', mag:12, rate:14, dmg:18, bulletV:8, color:'#ffdd44'},
  rifle: {name:'Автомат',  mag:30, rate:6,  dmg:22, bulletV:9, color:'#88ff66'},
  plasma:{name:'Плазма',   mag:20, rate:8,  dmg:38, bulletV:7, color:'#66ddff'},
  laser: {name:'Бластер',  mag:40, rate:5,  dmg:48, bulletV:11,color:'#ff66ff'}
};

// ============ ВРАГИ ============
const ENEMY_TYPES={
  scout:  {emoji:'👽', hp:35,  speed:1.2, dmg:8,  color:'#88ff44'},
  warrior:{emoji:'👾', hp:80,  speed:1.6, dmg:14, color:'#aa66ff'},
  brute:  {emoji:'👹', hp:160, speed:1.0, dmg:22, color:'#ff5544'},
  queen:  {emoji:'👑', hp:900, speed:0.8, dmg:35, color:'#ff2299'}
};

// ============ МИССИИ ============
const MISSIONS=[
  {
    name:'МИССИЯ 1: УЛИЦЫ',
    weapon:'pistol', reserve:60, bg:'city',
    enemies:[{type:'scout',n:6}],
    waves:1
  },
  {
    name:'МИССИЯ 2: ВОЕННАЯ БАЗА',
    weapon:'rifle', reserve:120, bg:'base',
    enemies:[{type:'scout',n:6},{type:'warrior',n:4}],
    waves:1
  },
  {
    name:'МИССИЯ 3: КОРАБЛЬ ПРИШЕЛЬЦЕВ',
    weapon:'plasma', reserve:120, bg:'ship',
    enemies:[{type:'warrior',n:6},{type:'brute',n:3}],
    waves:1
  },
  {
    name:'МИССИЯ 4: ТРОННЫЙ ЗАЛ',
    weapon:'laser', reserve:200, bg:'throne',
    enemies:[{type:'warrior',n:4},{type:'brute',n:2},{type:'queen',n:1}],
    waves:1
  }
];

// ============ СЮЖЕТ (кат-сцены) ============
const CUTSCENES=[
  // Пролог
  [
    {avatar:'🌆', name:'РАССКАЗЧИК', text:'Небо рассекли огни. Корабль рухнул в центр города.'},
    {avatar:'😨', name:'ТЫ', text:'Это не ракета. Это что-то другое.'},
    {avatar:'💀', name:'РАССКАЗЧИК', text:'Рядом мёртвый солдат, в руке — пистолет. В переулке шорох. Пора действовать.'}
  ],
  // После 1-й миссии
  [
    {avatar:'👨\u200d🔬', name:'ДОКТОР ВОЛКОВ', text:'Сюда! Эти твари — разведчики, метят цели для атаки.'},
    {avatar:'😤', name:'ТЫ', text:'Откуда они?'},
    {avatar:'👨\u200d🔬', name:'ВОЛКОВ', text:'Их центр — военная база. Уничтожь его. Держи автомат.'}
  ],
  // После 2-й миссии
  [
    {avatar:'👨\u200d🔬', name:'ВОЛКОВ', text:'Получилось! Я засёк материнский корабль.'},
    {avatar:'😎', name:'ТЫ', text:'Как туда попасть?'},
    {avatar:'👨\u200d🔬', name:'ВОЛКОВ', text:'Есть телепортер. Шанс один. Возьми плазму — она бьёт их броню.'}
  ],
  // После 3-й миссии
  [
    {avatar:'👨\u200d🔬', name:'ВОЛКОВ (по связи)', text:'Дальше — Королева. Убей её, и рой погибнет.'},
    {avatar:'😤', name:'ТЫ', text:'А если нет?'},
    {avatar:'👨\u200d🔬', name:'ВОЛКОВ', text:'Тогда Земле конец. Держи бластер. Удачи, герой.'}
  ],
  // Финал
  [
    {avatar:'🏆', name:'РАССКАЗЧИК', text:'Королева пала. Корабли падают с неба. Угроза миновала.'},
    {avatar:'😌', name:'ТЫ', text:'Закончилось...'},
    {avatar:'🌅', name:'РАССКАЗЧИК', text:'Простой парень, спасший планету. Конец.'}
  ]
];

// ============ СОСТОЯНИЕ ============
let gameState='menu'; // menu | cutscene | mission | gameover | victory
let curMission=0, curScene=0, curLine=0;
let player, enemies, bullets, items, missionWon, walls, mouseX=0, mouseY=0, mouseDown=false, keys={};

function startGame(){
  curMission=0; curScene=0; curLine=0;
  showCutscene(0);
}

function showCutscene(idx){
  gameState='cutscene'; curScene=idx; curLine=0;
  hud.style.display='none'; miss.style.display='none';
  stopMusic();
  renderCutscene();
}

function renderCutscene(){
  const scene=CUTSCENES[curScene];
  let html='';
  // показываем все строки до текущей + текущая
  for(let i=0;i<=curLine && i<scene.length;i++){
    const d=scene[i];
    html+=`<div class="dialog"><div class="avatar">${d.avatar}</div><div><div class="name">${d.name}</div><div class="text">${d.text}</div></div></div>`;
  }
  const isLast=curLine>=scene.length-1;
  if(curScene===0 && isLast){
    html+=`<button class="btn" id="next">НАЧАТЬ</button>`;
  } else if(curScene===CUTSCENES.length-1 && isLast){
    html+=`<button class="btn" id="next">В ГЛАВНОЕ МЕНЮ</button>`;
  } else if(isLast){
    html+=`<div class="vsLabel">▼ ${MISSIONS[curMission].name} ▼</div>`;
    html+=`<button class="btn" id="next">В БОЙ</button>`;
  } else {
    html+=`<div class="nextHint">— нажми ПРОБЕЛ или кликни для продолжения —</div>`;
  }
  screen.innerHTML=html;
  screen.classList.remove('hidden');
  const btn=document.getElementById('next');
  if(btn) btn.onclick=advanceCutscene;
  // клик/тап по самому экрану кат-сцены продвигает диалог (кроме случая с кнопкой)
  if(!btn){
    screen.onclick=advanceCutscene;
    screen.ontouchstart=(e)=>{e.preventDefault();advanceCutscene();};
  } else {
    screen.onclick=null;
    screen.ontouchstart=null;
  }
}

function advanceCutscene(){
  const scene=CUTSCENES[curScene];
  if(curLine<scene.length-1){
    curLine++; renderCutscene();
  } else {
    if(curScene===CUTSCENES.length-1){
      // финал — вернуть в меню
      showMenu();
    } else {
      // начать миссию
      startMission(curMission);
    }
  }
}

function showMenu(){
  gameState='menu';
  hud.style.display='none'; miss.style.display='none';
  stopMusic();
  screen.innerHTML=`
    <h1>ВТОРЖЕНИЕ</h1>
    <h2>история одного парня</h2>
    <p>Они пришли с неба. Город горит. Но один обычный человек встал у них на пути.<br>4 миссии. 1 герой. Спаси Землю от пришельцев.</p>
    <p style="font-size:14px;color:#9ab;"><span class="key">W A S D</span> — движение &nbsp; <span class="key">мышь</span> — целиться &nbsp; <span class="key">ЛКМ</span> — стрелять<br><span class="key">R</span> — перезарядка &nbsp; <span class="key">пробел</span> — диалоги дальше</p>
    <button class="btn" id="play">НАЧАТЬ ИГРУ</button>
  `;
  screen.classList.remove('hidden');
  document.getElementById('play').onclick=startGame;
}

// ============ ИГРОВАЯ ЛОГИКА ============
function startMission(idx){
  curMission=idx;
  const m=MISSIONS[idx];
  gameState='mission';
  screen.classList.add('hidden');
  hud.style.display='flex'; miss.style.display='block';
  miss.textContent=m.name;

  // игрок
  player={x:W*0.15,y:H*0.5,r:14,hp:100,maxHp:100,weapon:m.weapon,
    ammo:WEAPONS[m.weapon].mag,reserve:m.reserve,fireCd:0,reloadCd:0,a:0};

  enemies=[]; bullets=[]; items=[]; missionWon=false;
  walls=buildWalls(m.bg);

  // спавн врагов
  m.enemies.forEach(group=>{
    for(let i=0;i<group.n;i++){
      const t=ENEMY_TYPES[group.type];
      // случайная позиция справа, не в стене
      for(let a=0;a<200;a++){
        const ex=W*(0.5+Math.random()*0.45);
        const ey=40+Math.random()*(H-100);
        if(!hitsWall(ex,ey,20)){
          enemies.push({type:group.type,x:ex,y:ey,r:t.emoji==='👑'?28:18,hp:t.hp,maxHp:t.hp,
            speed:t.speed,dmg:t.dmg,emoji:t.emoji,color:t.color,
            hurt:0,fireCd:60+Math.random()*120,alive:true});
          break;
        }
      }
    }
  });

  // несколько аптечек по карте
  for(let i=0;i<3;i++){
    for(let a=0;a<50;a++){
      const ix=W*(0.25+Math.random()*0.6),iy=40+Math.random()*(H-100);
      if(!hitsWall(ix,iy,16)){items.push({x:ix,y:iy,type:'health',taken:false});break;}
    }
  }
  updHud();
  if(gameState==='mission') {startMusic(); requestAnimationFrame(loop);}
}

function buildWalls(bg){
  // стены/укрытия для разных карт
  const arr=[];
  // рамка
  // (рамку рисуем визуально, не как стены — игроки/враги ограничены границей экрана)
  if(bg==='city'){
    // дома-укрытия
    arr.push({x:300,y:80,w:80,h:60});
    arr.push({x:500,y:200,w:60,h:90});
    arr.push({x:350,y:380,w:90,h:60});
    arr.push({x:650,y:380,w:60,h:90});
  } else if(bg==='base'){
    // контейнеры
    arr.push({x:250,y:140,w:70,h:70});
    arr.push({x:400,y:260,w:120,h:50});
    arr.push({x:600,y:140,w:70,h:70});
    arr.push({x:250,y:380,w:70,h:70});
    arr.push({x:600,y:380,w:70,h:70});
  } else if(bg==='ship'){
    // колонны
    arr.push({x:350,y:100,w:40,h:340});
    arr.push({x:520,y:100,w:40,h:340});
    arr.push({x:680,y:200,w:40,h:160});
  } else if(bg==='throne'){
    // колонны вокруг
    arr.push({x:380,y:100,w:30,h:130});
    arr.push({x:380,y:310,w:30,h:130});
    arr.push({x:600,y:100,w:30,h:130});
    arr.push({x:600,y:310,w:30,h:130});
  }
  return arr;
}

function hitsWall(x,y,r){
  for(const w of walls){
    if(x+r>w.x && x-r<w.x+w.w && y+r>w.y && y-r<w.y+w.h) return true;
  }
  return false;
}

function lineHitsWall(x1,y1,x2,y2){
  // проверка пересечения отрезка со стенами (для пуль)
  for(const w of walls){
    if(segRectIntersect(x1,y1,x2,y2,w.x,w.y,w.w,w.h)) return true;
  }
  return false;
}

function segRectIntersect(x1,y1,x2,y2,rx,ry,rw,rh){
  // достаточно проверить попадание любого конца в прямоугольник
  if(x2>=rx && x2<=rx+rw && y2>=ry && y2<=ry+rh) return true;
  return false;
}

// управление
cv.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect();
  mouseX=(e.clientX-r.left)*(W/r.width);
  mouseY=(e.clientY-r.top)*(H/r.height);
});
cv.addEventListener('mousedown',e=>{mouseDown=true;if(gameState==='cutscene')advanceCutscene();});
cv.addEventListener('mouseup',()=>mouseDown=false);
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='KeyR' && gameState==='mission') reload();
  if(e.code==='Space'){
    if(gameState==='cutscene') advanceCutscene();
    e.preventDefault();
  }
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

// ===== ТАЧ: виртуальный джойстик + кнопка огня =====
let joyActive=false, joyDX=0, joyDY=0;
const joystick=document.getElementById('joystick');
const joyKnob=document.getElementById('joyKnob');
const fireBtn=document.getElementById('fireBtn');
const touchControls=document.getElementById('touchControls');

if(('ontouchstart' in window) || navigator.maxTouchPoints>0){
  touchControls.style.display='block';
}

joystick.addEventListener('touchstart',e=>{e.preventDefault();joyActive=true;updateJoy(e.touches[0]);},{passive:false});
joystick.addEventListener('touchmove',e=>{e.preventDefault();updateJoy(e.touches[0]);},{passive:false});
joystick.addEventListener('touchend',e=>{e.preventDefault();joyActive=false;joyDX=0;joyDY=0;joyKnob.style.left='35px';joyKnob.style.top='35px';},{passive:false});
function updateJoy(t){
  const r=joystick.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  let dx=t.clientX-cx, dy=t.clientY-cy;
  const maxR=r.width/2-10;
  const d=Math.hypot(dx,dy);
  if(d>maxR){dx=dx/d*maxR;dy=dy/d*maxR;}
  joyKnob.style.left=(35+dx)+'px';
  joyKnob.style.top=(35+dy)+'px';
  joyDX=dx/maxR; joyDY=dy/maxR;
}

fireBtn.addEventListener('touchstart',e=>{e.preventDefault();mouseDown=true;if(gameState==='cutscene')advanceCutscene();},{passive:false});
fireBtn.addEventListener('touchend',e=>{e.preventDefault();mouseDown=false;},{passive:false});

// тап по канвасу — продвижение кат-сцен на телефоне
cv.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(gameState==='cutscene') advanceCutscene();
},{passive:false});


function reload(){
  const mag=WEAPONS[player.weapon].mag;
  if(player.ammo>=mag||player.reserve<=0||player.reloadCd>0)return;
  player.reloadCd=60; // 1 сек
}

function shoot(){
  if(player.ammo<=0){
    // автоматически перезарядиться, если есть патроны в запасе
    if(player.reloadCd<=0 && player.reserve>0) reload();
    return;
  }
  if(player.fireCd>0||player.reloadCd>0)return;
  const w=WEAPONS[player.weapon];
  player.ammo--;
  player.fireCd=w.rate;
  bullets.push({x:player.x,y:player.y,vx:Math.cos(player.a)*w.bulletV,vy:Math.sin(player.a)*w.bulletV,
    dmg:w.dmg,color:w.color,life:90,fromPlayer:true});
  sfxShoot();
  updHud();
}

function enemyShoot(en){
  const a=Math.atan2(player.y-en.y,player.x-en.x);
  bullets.push({x:en.x,y:en.y,vx:Math.cos(a)*4,vy:Math.sin(a)*4,
    dmg:en.dmg,color:'#ff5522',life:120,fromPlayer:false});
}

function updHud(){
  hpEl.textContent=Math.max(0,player.hp);
  ammoEl.textContent=player.ammo;
  reserveEl.textContent=player.reserve;
  wnameEl.textContent=WEAPONS[player.weapon].name;
  leftEl.textContent=enemies.filter(e=>e.alive).length;
}

function update(){
  // движение игрока
  let dx=0,dy=0;
  if(keys['KeyW']||keys['ArrowUp']) dy-=1;
  if(keys['KeyS']||keys['ArrowDown']) dy+=1;
  if(keys['KeyA']||keys['ArrowLeft']) dx-=1;
  if(keys['KeyD']||keys['ArrowRight']) dx+=1;
  // джойстик (тач)
  if(joyActive && (Math.abs(joyDX)>0.1 || Math.abs(joyDY)>0.1)){
    dx=joyDX; dy=joyDY;
  }
  if(dx||dy){
    const len=Math.hypot(dx,dy);
    dx/=len;dy/=len;
    const sp=2.6;
    const nx=player.x+dx*sp,ny=player.y+dy*sp;
    if(!hitsWall(nx,player.y,player.r) && nx-player.r>0 && nx+player.r<W) player.x=nx;
    if(!hitsWall(player.x,ny,player.r) && ny-player.r>0 && ny+player.r<H-40) player.y=ny;
    // на тач — целимся туда, куда движемся
    if(joyActive) player.aimX=dx, player.aimY=dy;
  }
  // прицел — автонаведение на ближайшего живого врага
  let nearest=null, nd=Infinity;
  enemies.forEach(en=>{
    if(!en.alive)return;
    const d=Math.hypot(en.x-player.x, en.y-player.y);
    if(d<nd){nd=d;nearest=en;}
  });
  if(nearest){
    // плавно поворачиваемся к врагу
    const targetA=Math.atan2(nearest.y-player.y, nearest.x-player.x);
    let diff=targetA-player.a;
    while(diff>Math.PI)diff-=2*Math.PI;
    while(diff<-Math.PI)diff+=2*Math.PI;
    player.a+=diff*0.25; // скорость доводки
  } else if(joyActive && (player.aimX!==undefined)){
    player.a=Math.atan2(player.aimY, player.aimX);
  } else {
    player.a=Math.atan2(mouseY-player.y,mouseX-player.x);
  }

  // перезарядка
  if(player.reloadCd>0){
    player.reloadCd--;
    if(player.reloadCd===0){
      const mag=WEAPONS[player.weapon].mag;
      const need=mag-player.ammo, take=Math.min(need,player.reserve);
      player.ammo+=take;player.reserve-=take;
      updHud();
    }
  }
  if(player.fireCd>0) player.fireCd--;
  // авто-стрельба пока зажата кнопка
  if(mouseDown) shoot();

  // пули
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    const nx=b.x+b.vx, ny=b.y+b.vy;
    if(lineHitsWall(b.x,b.y,nx,ny)){bullets.splice(i,1);continue;}
    b.x=nx;b.y=ny;b.life--;
    if(b.life<=0||b.x<0||b.x>W||b.y<0||b.y>H){bullets.splice(i,1);continue;}
    if(b.fromPlayer){
      // в врагов
      for(const en of enemies){
        if(!en.alive)continue;
        if(Math.hypot(en.x-b.x,en.y-b.y)<en.r){
          en.hp-=b.dmg;en.hurt=8;
          bullets.splice(i,1);
          if(en.hp<=0){en.alive=false;
            sfxKill();
            if(Math.random()<0.2) items.push({x:en.x,y:en.y,type:'ammo',taken:false});
          }
          checkWin();
          updHud();
          break;
        }
      }
    } else {
      // в игрока
      if(Math.hypot(player.x-b.x,player.y-b.y)<player.r){
        player.hp-=b.dmg;bullets.splice(i,1);
        sfxHurt();
        flashEl.style.opacity=0.5;setTimeout(()=>flashEl.style.opacity=0,120);
        if(player.hp<=0){lose();return;}
        updHud();
      }
    }
  }

  // враги
  enemies.forEach(en=>{
    if(!en.alive)return;
    if(en.hurt>0)en.hurt--;
    const d=Math.hypot(en.x-player.x,en.y-player.y);
    // двигаются к игроку с дистанцией
    const wantD = en.type==='queen' ? 200 : (en.type==='brute' ? 120 : 150);
    if(Math.abs(d-wantD)>30){
      const dir = d>wantD?1:-1;
      const ax=(player.x-en.x)/d*en.speed*dir;
      const ay=(player.y-en.y)/d*en.speed*dir;
      if(!hitsWall(en.x+ax,en.y,en.r) && en.x+ax>en.r && en.x+ax<W-en.r) en.x+=ax;
      if(!hitsWall(en.x,en.y+ay,en.r) && en.y+ay>en.r && en.y+ay<H-en.r-40) en.y+=ay;
    }
    // стреляют
    en.fireCd--;
    if(en.fireCd<=0 && d<400 && !lineHitsWall(en.x,en.y,player.x,player.y)){
      enemyShoot(en);
      en.fireCd = en.type==='queen'?40 : (en.type==='brute'?100 : (en.type==='warrior'?80 : 120));
    }
  });

  // подбор предметов
  items.forEach(it=>{
    if(it.taken)return;
    if(Math.hypot(it.x-player.x,it.y-player.y)<player.r+12){
      it.taken=true;
      if(it.type==='health'){player.hp=Math.min(player.maxHp,player.hp+30);}
      if(it.type==='ammo'){player.reserve+=WEAPONS[player.weapon].mag;}
      updHud();
    }
  });
}

function checkWin(){
  if(missionWon)return;
  if(enemies.every(e=>!e.alive)){
    missionWon=true;
    setTimeout(winMission, 800);
  }
}

function winMission(){
  // показать следующую кат-сцену
  if(curMission < MISSIONS.length-1){
    curMission++;
    showCutscene(curMission); // CUTSCENES[1..3] перед миссиями 2..4
  } else {
    // последняя миссия — финальная сцена
    showCutscene(CUTSCENES.length-1);
  }
}

function lose(){
  gameState='gameover';
  hud.style.display='none'; miss.style.display='none';
  stopMusic();
  screen.innerHTML=`<h1>ТЫ ПОГИБ</h1>
    <p>Земля пала... но не всё ещё кончено.</p>
    <button class="btn" id="retry">ПОВТОРИТЬ МИССИЮ</button>
    <button class="btn" id="menuBtn" style="background:linear-gradient(135deg,#555,#222);">В МЕНЮ</button>`;
  screen.classList.remove('hidden');
  document.getElementById('retry').onclick=()=>{startMission(curMission);};
  document.getElementById('menuBtn').onclick=showMenu;
}

// ============ РЕНДЕР ============
function render(){
  // фон
  drawBackground(MISSIONS[curMission].bg);

  // предметы
  items.forEach(it=>{
    if(it.taken)return;
    const e=it.type==='health'?'❤️':'📦';
    ctx.font='28px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    // пульс
    const t=(Date.now()/300)%1;
    ctx.globalAlpha=0.4+0.2*Math.sin(t*Math.PI*2);
    ctx.beginPath();ctx.arc(it.x,it.y,18,0,7);
    ctx.fillStyle=it.type==='health'?'rgba(0,255,140,0.3)':'rgba(120,200,255,0.3)';ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillText(e,it.x,it.y);
  });

  // стены
  walls.forEach(w=>{
    ctx.fillStyle='#3a3a48';ctx.fillRect(w.x,w.y,w.w,w.h);
    ctx.fillStyle='#1a1a22';ctx.fillRect(w.x,w.y,w.w,3);
    ctx.fillStyle='#5a5a68';ctx.fillRect(w.x,w.y+3,w.w,2);
  });

  // враги
  enemies.forEach(en=>{
    if(!en.alive)return;
    ctx.font=`${en.r*2}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    if(en.hurt>0) ctx.globalAlpha=0.55;
    ctx.fillText(en.emoji,en.x,en.y);
    ctx.globalAlpha=1;
    // полоска хп
    if(en.hp<en.maxHp){
      const bw=en.r*2.2;
      ctx.fillStyle='#000';ctx.fillRect(en.x-bw/2,en.y-en.r-10,bw,4);
      ctx.fillStyle=en.type==='queen'?'#ff3322':'#33dd44';
      ctx.fillRect(en.x-bw/2,en.y-en.r-10,bw*(en.hp/en.maxHp),4);
    }
  });

  // пули
  bullets.forEach(b=>{
    ctx.beginPath();ctx.arc(b.x,b.y,4,0,7);
    ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=14;ctx.fill();ctx.shadowBlur=0;
    // след
    ctx.strokeStyle=b.color;ctx.lineWidth=2;ctx.globalAlpha=0.5;
    ctx.beginPath();ctx.moveTo(b.x-b.vx*2,b.y-b.vy*2);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.globalAlpha=1;
  });

  // игрок
  ctx.save();
  ctx.translate(player.x,player.y);
  ctx.rotate(player.a);
  // тень
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,4,18,8,0,0,7);ctx.fill();
  // тело
  ctx.fillStyle='#3a78cc';ctx.beginPath();ctx.arc(0,0,player.r,0,7);ctx.fill();
  // оружие
  ctx.fillStyle='#222';ctx.fillRect(player.r-2,-3,22,6);
  ctx.fillStyle='#444';ctx.fillRect(player.r+18,-2,4,4);
  ctx.restore();

  // полоска перезарядки
  if(player.reloadCd>0){
    const pct=1-player.reloadCd/60;
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(player.x-22,player.y-28,44,6);
    ctx.fillStyle='#88ccff';ctx.fillRect(player.x-22,player.y-28,44*pct,6);
  }
}

function drawBackground(bg){
  if(bg==='city'){
    // тёмный город ночью
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0a0612');g.addColorStop(1,'#1a1828');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    // плитка дороги
    ctx.strokeStyle='rgba(120,140,180,.08)';ctx.lineWidth=1;
    for(let i=0;i<W;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke();}
    for(let i=0;i<H;i+=40){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke();}
    // следы взрыва
    ctx.fillStyle='rgba(255,140,40,.04)';ctx.beginPath();ctx.arc(W*0.7,H*0.3,180,0,7);ctx.fill();
  } else if(bg==='base'){
    // военная база
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#1a1e10');g.addColorStop(1,'#0e1208');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(180,200,120,.06)';
    for(let i=0;i<W;i+=60){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke();}
    for(let i=0;i<H;i+=60){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke();}
  } else if(bg==='ship'){
    // корабль пришельцев — фиолетовый
    const g=ctx.createRadialGradient(W/2,H/2,40,W/2,H/2,W);
    g.addColorStop(0,'#3a1a4a');g.addColorStop(1,'#0a0418');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    // светящиеся пятна
    for(let i=0;i<6;i++){
      const cx=100+i*120, cy=80+((i%2)*340);
      ctx.fillStyle='rgba(150,80,255,.07)';
      ctx.beginPath();ctx.arc(cx,cy,60,0,7);ctx.fill();
    }
  } else if(bg==='throne'){
    // тронный зал — красный
    const g=ctx.createRadialGradient(W/2,H/2,40,W/2,H/2,W);
    g.addColorStop(0,'#3a0820');g.addColorStop(1,'#10000a');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    // огни в углах
    ctx.fillStyle='rgba(255,80,120,.08)';
    ctx.beginPath();ctx.arc(60,60,80,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(W-60,60,80,0,7);ctx.fill();
  }
}

function loop(){
  if(gameState!=='mission')return;
  update();render();
  requestAnimationFrame(loop);
}

// ============ СТАРТ ============
showMenu();
</script>
