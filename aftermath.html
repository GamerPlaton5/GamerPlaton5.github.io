  .crosshair::before,.crosshair::after{content:'';position:absolute;background:rgba(255,200,140,.85);}
  .crosshair::before{left:50%;top:0;width:2px;height:22px;transform:translateX(-50%);}
  .crosshair::after{top:50%;left:0;height:2px;width:22px;transform:translateY(-50%);}
  #hud{position:absolute;bottom:0;left:0;right:0;z-index:5;display:flex;
    justify-content:space-between;padding:10px 18px;color:#e0c070;font-size:18px;font-weight:700;

  #miss{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:5;

  #gun{position:absolute;bottom:-12px;right:24px;z-index:3;font-size:130px;
    transform:scaleX(-1) rotate(-8deg);filter:drop-shadow(-4px -6px 8px rgba(0,0,0,.7));
    pointer-events:none;transition:transform .05s;}
  #gun.fire{transform:scaleX(-1) rotate(-8deg) translateY(10px);}
  #muzzle{position:absolute;bottom:60px;right:50px;z-index:4;font-size:70px;opacity:0;pointer-events:none;}
  #flash{position:absolute;inset:0;z-index:3;background:#aa0000;opacity:0;pointer-events:none;transition:opacity .12s;}
  #lockHint{position:absolute;top:34px;left:50%;transform:translateX(-50%);z-index:6;
    color:#fc9;font-size:13px;background:rgba(0,0,0,.6);padding:3px 12px;border-radius:4px;
    pointer-events:none;opacity:0;transition:opacity .3s;}
  #screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;color:#cde;padding:30px;
    background:radial-gradient(ellipse at center,#1a0e08 0%,#08040a 70%);}

  h1{font-size:52px;color:#e09c40;text-shadow:0 0 30px #c06010;margin-bottom:8px;letter-spacing:5px;

  p{font-size:16px;line-height:1.7;margin-bottom:16px;color:#cba;max-width:620px;}
  .key{background:#241510;border:1px solid #b88040;border-radius:4px;padding:2px 9px;color:#fcb070;font-family:'Russo One';}
  .btn{background:linear-gradient(135deg,#c87030,#803010);color:#fff;border:none;
    border-radius:6px;padding:14px 46px;font-family:'Orbitron';font-size:20px;font-weight:900;
    cursor:pointer;letter-spacing:3px;box-shadow:0 0 28px rgba(200,100,40,.55);text-transform:uppercase;margin-top:6px;}
  .btn:active{transform:scale(.96);}

  .dialog{display:flex;align-items:flex-start;gap:18px;text-align:left;

// ============ АУДИО ============
let audioCtx=null,musicGain=null,musicTimer=null,musicOn=false,melodyIdx=0;
function initAudio(){
  if(audioCtx)return;
  try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    musicGain=audioCtx.createGain();musicGain.gain.value=0.16;musicGain.connect(audioCtx.destination);}
  catch(e){audioCtx=null;}
}
function note(f,when,dur,type='square',vol=0.18){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,when);
  g.gain.setValueAtTime(0.0001,when);
  g.gain.exponentialRampToValueAtTime(vol,when+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,when+dur);
  o.connect(g);g.connect(musicGain);o.start(when);o.stop(when+dur+0.02);
}
function kick(when){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='sine';o.frequency.setValueAtTime(120,when);
  o.frequency.exponentialRampToValueAtTime(40,when+0.15);
  g.gain.setValueAtTime(0.5,when);g.gain.exponentialRampToValueAtTime(0.0001,when+0.18);
  o.connect(g);g.connect(musicGain);o.start(when);o.stop(when+0.2);
}
// Постапокалиптическая тёмная тема (медленная, минорная)
const MELODY=[
  {bass:73.42, mel:[440,0,392,440,523,0,0,392]},   // D2
  {bass:82.41, mel:[392,0,349,392,440,0,392,349]}, // E2
  {bass:65.41, mel:[523,0,440,392,349,0,0,392]},   // C2
  {bass:73.42, mel:[440,0,523,587,523,440,392,349]} // D2
];
function scheduleBar(when){
  if(!musicOn||!audioCtx)return;
  const bar=MELODY[melodyIdx%MELODY.length];
  const beatLen=0.35; // 2.8 сек на такт (медленная атмосфера)
  note(bar.bass,when,2.6,'triangle',0.22);
  note(bar.bass*2,when,2.6,'sine',0.05);
  kick(when);kick(when+beatLen*4);
  for(let i=0;i<8;i++){const f=bar.mel[i];if(f>0) note(f,when+beatLen*i,beatLen*0.85,'square',0.07);}
  melodyIdx++;
}
function musicLoop(){
  if(!musicOn||!audioCtx)return;
  const now=audioCtx.currentTime;
  scheduleBar(now+0.05);scheduleBar(now+2.85);
  musicTimer=setTimeout(musicLoop,5600);
}
function startMusic(){initAudio();if(!audioCtx)return;if(audioCtx.state==='suspended')audioCtx.resume();
  if(musicOn)return;musicOn=true;melodyIdx=0;musicLoop();}
function stopMusic(){musicOn=false;if(musicTimer){clearTimeout(musicTimer);musicTimer=null;}}

function sfxShoot(){
  if(!audioCtx)return;
  const t=audioCtx.currentTime;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(800,t);
  o.frequency.exponentialRampToValueAtTime(100,t+0.09);
  g.gain.setValueAtTime(0.18,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.1);
  o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+0.12);
}
function sfxKill(){
  if(!audioCtx)return;
  const t=audioCtx.currentTime;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='square';o.frequency.setValueAtTime(180,t);
  o.frequency.exponentialRampToValueAtTime(50,t+0.22);
  g.gain.setValueAtTime(0.22,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);
  o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+0.3);
}
function sfxHurt(){
  if(!audioCtx)return;
  const t=audioCtx.currentTime;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(160,t);
  o.frequency.exponentialRampToValueAtTime(50,t+0.15);
  g.gain.setValueAtTime(0.25,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
  o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+0.22);
}

let gameState='menu',curMission=0,curScene=0,curLine=0;
let MAP,MW,MH,palette;
let px,py,pa,hp,maxHp=100,ammo,reserve,reloadCd,fireCd,weapon,enemies,medkits,bullets,damageCd;
let mouseTurn=0,turnBuffer=0,keys={},firing=false,missionWon=false;
const FOV=Math.PI/3;

function cell(x,y){if(x<0||y<0||x>=MW||y>=MH)return 1;return MAP[y|0][x|0]==='1'?1:0;}

// ============ ЭКРАНЫ ============
function showMenu(){
  gameState='menu';stopMusic();
  hud.style.display='none';miss.style.display='none';gunEl.style.display='none';lockHint.style.opacity=0;
  if(document.exitPointerLock)document.exitPointerLock();
  screen.innerHTML=`
    <h1>ПОСЛЕ ВСЕГО</h1>
    <h2>история выжившего</h2>
    <p>Мир закончился двадцать лет назад. Ты выжил в бункере, но еда кончилась. Где-то на западе, говорят, остался оазис. Дойди.</p>
    <p style="font-size:14px;color:#a98;"><span class="key">W A S D</span> — движение &nbsp; <span class="key">мышь</span> — обзор &nbsp; <span class="key">ЛКМ</span> — огонь<br><span class="key">R</span> — перезарядка &nbsp; <span class="key">пробел</span> — дальше в диалогах</p>
    <button class="btn" id="play">НАЧАТЬ ПУТЬ</button>
  `;
  screen.classList.remove('hidden');
  document.getElementById('play').onclick=()=>{curMission=0;showCutscene(0);};
}

function showCutscene(idx){
  gameState='cutscene';stopMusic();
  curScene=idx;curLine=0;
  hud.style.display='none';miss.style.display='none';gunEl.style.display='none';lockHint.style.opacity=0;
  if(document.exitPointerLock)document.exitPointerLock();
  renderCutscene();
}
function renderCutscene(){
  const sc=CUTSCENES[curScene];
  let html='';
  for(let i=0;i<=curLine && i<sc.length;i++){
    const d=sc[i];
    html+=`<div class="dialog"><div class="avatar">${d.avatar}</div><div><div class="name">${d.name}</div><div class="text">${d.text}</div></div></div>`;
  }
  const last=curLine>=sc.length-1;
  if(curScene===CUTSCENES.length-1 && last){
    html+=`<button class="btn" id="next">В МЕНЮ</button>`;
  } else if(last){
    html+=`<div class="vsLabel">▼ ${MISSIONS[curMission].name} ▼</div>`;
    html+=`<button class="btn" id="next">ВПЕРЁД</button>`;
  } else {
    html+=`<div class="nextHint">— нажми ПРОБЕЛ или кликни —</div>`;
  }
  screen.innerHTML=html;
  screen.classList.remove('hidden');
  const b=document.getElementById('next');
  if(b) b.onclick=advanceCutscene;
}
function advanceCutscene(){
  const sc=CUTSCENES[curScene];
  if(curLine<sc.length-1){curLine++;renderCutscene();}
  else if(curScene===CUTSCENES.length-1){showMenu();}
  else {startMission(curMission);}
}

// ============ МИССИЯ ============
function startMission(idx){
  curMission=idx;
  const m=MISSIONS[idx];
  MAP=MAPS[m.map];MH=MAP.length;MW=MAP[0].length;
  palette=m.palette;
  gameState='mission';screen.classList.add('hidden');
  hud.style.display='flex';miss.style.display='block';gunEl.style.display='block';
  miss.textContent=m.name;
  px=1.5;py=1.5;pa=0.5;hp=maxHp;weapon=m.weapon;
  ammo=WEAPONS[m.weapon].mag;reserve=m.reserve;
  reloadCd=0;fireCd=0;damageCd=0;mouseTurn=0;turnBuffer=0;firing=false;missionWon=false;
  enemies=[];
  m.spawns.forEach(s=>{
    const t=ENEMY_TYPES[s[2]];
    enemies.push({type:s[2],x:s[0]+0.5,y:s[1]+0.5,hp:t.hp,maxHp:t.hp,speed:t.speed,dmg:t.dmg,
      emoji:t.emoji,ranged:t.ranged,fireCd:t.fireCd||0,alive:true,hurt:0,jump:Math.random()*6});
  });
  medkits=m.medkits.map(s=>({x:s[0]+0.5,y:s[1]+0.5,taken:false}));
  bullets=[]; // пули врагов с дальним боем
  updHud();
  startMusic();
  wrap.requestPointerLock();
  requestAnimationFrame(loop);
}

function updHud(){
  hpEl.textContent=Math.max(0,hp);
  ammoEl.textContent=ammo;
  reserveEl.textContent=reserve;
  wnameEl.textContent=WEAPONS[weapon].name;
  leftEl.textContent=enemies.filter(e=>e.alive).length;
}

// ============ УПРАВЛЕНИЕ ============
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='KeyR' && gameState==='mission') reload();
  if(e.code==='Space'){
    if(gameState==='cutscene') advanceCutscene();
    e.preventDefault();
  }
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});
wrap.addEventListener('mousedown',e=>{
  if(gameState==='cutscene'){advanceCutscene();return;}
  if(gameState!=='mission')return;
  if(document.pointerLockElement!==wrap){wrap.requestPointerLock();}
  firing=true;e.preventDefault();
});
document.addEventListener('mouseup',()=>{firing=false;});
document.addEventListener('mousemove',e=>{
  if(gameState!=='mission')return;
  if(document.pointerLockElement===wrap){turnBuffer+=e.movementX*0.0006;}
});
document.addEventListener('pointerlockchange',()=>{
  lockHint.style.opacity=(gameState==='mission'&&document.pointerLockElement!==wrap)?1:0;
});

function reload(){
  const mag=WEAPONS[weapon].mag;
  if(ammo>=mag||reserve<=0||reloadCd>0)return;
  reloadCd=60;
}
function shoot(){
  if(ammo<=0||reloadCd>0)return;
  ammo--;updHud();
  muzzle.style.opacity=1;gunEl.classList.add('fire');
  setTimeout(()=>{muzzle.style.opacity=0;gunEl.classList.remove('fire');},45);
  sfxShoot();
  const w=WEAPONS[weapon];
  if(w.pellets){
    for(let p=0;p<w.pellets;p++){
      const aOff=(Math.random()-0.5)*w.spread;
      hitscan(aOff,w.dmg);
    }
  } else hitscan(0,w.dmg);
}
function hitscan(aOff,dmg){
  let best=null,bd=99;
  enemies.forEach(en=>{
    if(!en.alive)return;
    let ang=Math.atan2(en.y-py,en.x-px)-(pa+aOff);
    while(ang<-Math.PI)ang+=2*Math.PI;while(ang>Math.PI)ang-=2*Math.PI;
    const d=Math.hypot(en.x-px,en.y-py);
    if(Math.abs(ang)<0.09&&d<bd&&!wallBetween(px,py,en.x,en.y)){best=en;bd=d;}
  });
  if(best){
    best.hp-=dmg;best.hurt=6;
    if(best.hp<=0){best.alive=false;sfxKill();checkWin();}
    updHud();
  }
}
function checkWin(){
  if(missionWon)return;
  if(enemies.every(e=>!e.alive)){
    missionWon=true;
    setTimeout(()=>{
      if(curMission<MISSIONS.length-1){curMission++;showCutscene(curMission);}
      else showCutscene(CUTSCENES.length-1);
    },800);
  }
}

// ============ ОБНОВЛЕНИЕ ============
function move(){
  let dx=0,dy=0,sp=0.025;
  if(keys['KeyW']){dx+=Math.cos(pa)*sp;dy+=Math.sin(pa)*sp;}
  if(keys['KeyS']){dx-=Math.cos(pa)*sp;dy-=Math.sin(pa)*sp;}
  if(keys['KeyA']){dx+=Math.cos(pa-Math.PI/2)*sp;dy+=Math.sin(pa-Math.PI/2)*sp;}
  if(keys['KeyD']){dx+=Math.cos(pa+Math.PI/2)*sp;dy+=Math.sin(pa+Math.PI/2)*sp;}
  if(keys['ArrowLeft'])pa-=0.045;
  if(keys['ArrowRight'])pa+=0.045;
  let step=turnBuffer*0.18;const mx=0.06;
  if(step>mx)step=mx;if(step<-mx)step=-mx;
  pa+=step;turnBuffer-=step;
  const R=0.22;
  if(cell(px+Math.sign(dx)*R+dx,py)===0)px+=dx;
  if(cell(px,py+Math.sign(dy)*R+dy)===0)py+=dy;
}
function updateEnemies(){
  damageCd--;fireCd--;
  const w=WEAPONS[weapon];
  if(firing&&fireCd<=0){shoot();fireCd=w.rate;if(!w.auto)firing=false;}
  if(reloadCd>0){
    reloadCd--;
    if(reloadCd===0){
      const mag=WEAPONS[weapon].mag;
      const need=mag-ammo,take=Math.min(need,reserve);
      ammo+=take;reserve-=take;updHud();
    }
  }
  // подбор аптечек
  medkits.forEach(m=>{
    if(m.taken)return;
    if(Math.hypot(m.x-px,m.y-py)<0.6){m.taken=true;hp=Math.min(maxHp,hp+30);updHud();}
  });
  // враги
  enemies.forEach(en=>{
    if(!en.alive)return;
    if(en.hurt>0)en.hurt--;
    en.jump+=0.15;
    const d=Math.hypot(en.x-px,en.y-py);
    if(en.ranged){
      // бандит держит дистанцию и стреляет
      const wantD=3.0;
      if(d>0.8){
        const dir=d>wantD?1:(d<wantD-0.5?-1:0);
        const ex=(en.x-px)/d*en.speed*dir;
        const ey=(en.y-py)/d*en.speed*dir;
        if(cell(en.x-ex,en.y)===0)en.x-=ex;
        if(cell(en.x,en.y-ey)===0)en.y-=ey;
      }
      en.fireCd--;
      if(en.fireCd<=0 && d<8 && !wallBetween(en.x,en.y,px,py)){
        bullets.push({x:en.x,y:en.y,a:Math.atan2(py-en.y,px-en.x),v:0.18,life:120,dmg:en.dmg});
        en.fireCd=ENEMY_TYPES[en.type].fireCd;
      }
    } else {
      // ближний бой — бежит на игрока
      if(d>0.8){
        const sp=en.speed,R=0.25;
        const ex=(en.x-px)/d*sp, ey=(en.y-py)/d*sp;
        const tx=en.x-ex;
        if(cell(tx+Math.sign(-ex)*R,en.y)===0) en.x=tx;
        const ty=en.y-ey;
        if(cell(en.x,ty+Math.sign(-ey)*R)===0) en.y=ty;
      }
      if(d<0.9 && damageCd<=0){
        hp-=en.dmg;damageCd=60;sfxHurt();
        flashEl.style.opacity=0.5;setTimeout(()=>flashEl.style.opacity=0,120);
        if(hp<=0){lose();return;}
        updHud();
      }
    }
  });
  // пули врагов
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=Math.cos(b.a)*b.v;b.y+=Math.sin(b.a)*b.v;b.life--;
    if(b.life<=0||cell(b.x,b.y)===1){bullets.splice(i,1);continue;}
    if(Math.hypot(b.x-px,b.y-py)<0.35){
      hp-=b.dmg;sfxHurt();
      flashEl.style.opacity=0.4;setTimeout(()=>flashEl.style.opacity=0,100);
      bullets.splice(i,1);
      if(hp<=0){lose();return;}
      updHud();
    }
  }
}
function wallBetween(x1,y1,x2,y2){
  const d=Math.hypot(x2-x1,y2-y1);
  const steps=Math.ceil(d*14);
  for(let i=1;i<steps;i++){
    const t=i/steps,x=x1+(x2-x1)*t,y=y1+(y2-y1)*t;
    if(cell(x,y)===1)return true;
    if(cell(x+0.12,y)===1&&cell(x-0.12,y)===1)return true;
    if(cell(x,y+0.12)===1&&cell(x,y-0.12)===1)return true;
  }
  return false;
}

// ============ РЕНДЕР ============
const depth=new Array(CW);
function render(){
  // небо и земля по палитре
  const sky=ctx.createLinearGradient(0,0,0,CH/2);
  sky.addColorStop(0,palette.sky1);sky.addColorStop(1,palette.sky2);
  ctx.fillStyle=sky;ctx.fillRect(0,0,CW,CH/2);
  const gr=ctx.createLinearGradient(0,CH/2,0,CH);
  gr.addColorStop(0,palette.ground1);gr.addColorStop(1,palette.ground2);
  ctx.fillStyle=gr;ctx.fillRect(0,CH/2,CW,CH/2);

  for(let col=0;col<CW;col++){
    const rayA=pa-FOV/2+(col/CW)*FOV,cos=Math.cos(rayA),sin=Math.sin(rayA);
    let dist=0,hit=false;
    while(!hit&&dist<20){dist+=0.025;if(cell(px+cos*dist,py+sin*dist)===1)hit=true;}
    const corr=dist*Math.cos(rayA-pa);depth[col]=corr;
    const h=Math.min(CH,CH/corr);
    const fog=Math.max(0.15,1-corr/13);
    const gx=px+cos*dist,gy=py+sin*dist;
    const gridc=(Math.floor(gx*2)+Math.floor(gy*2))%2;
    const base=gridc?palette.wall1:palette.wall2;
    ctx.fillStyle=`rgb(${(base[0]*fog)|0},${(base[1]*fog)|0},${(base[2]*fog)|0})`;
    ctx.fillRect(col,(CH-h)/2,1,h);
  }

  // спрайты — враги, аптечки, пули
  const sprites=[];
  enemies.forEach(en=>{if(en.alive)sprites.push({t:'enemy',o:en,d:Math.hypot(en.x-px,en.y-py)});});
  medkits.forEach(m=>{if(!m.taken)sprites.push({t:'med',o:m,d:Math.hypot(m.x-px,m.y-py)});});
  bullets.forEach(b=>sprites.push({t:'bullet',o:b,d:Math.hypot(b.x-px,b.y-py)}));
  sprites.sort((a,b)=>b.d-a.d);
  sprites.forEach(({t,o,d})=>{
    let ang=Math.atan2(o.y-py,o.x-px)-pa;
    while(ang<-Math.PI)ang+=2*Math.PI;while(ang>Math.PI)ang-=2*Math.PI;
    if(Math.abs(ang)>FOV/1.4)return;
    if(wallBetween(px,py,o.x,o.y))return;
    const sx=(0.5+ang/FOV)*CW;
    if(t==='enemy'){
      const bs = o.type==='mega'?2.0:(o.type==='bandit'?1.3:1.1);
      const size=Math.min(CH*bs,CH/d*bs*0.85);
      const bob=Math.abs(Math.sin(o.jump))*size*0.12;
      const sy=CH/2+size/2-bob;
      ctx.font=`${size}px serif`;ctx.textAlign='center';ctx.textBaseline='bottom';
      if(o.hurt>0)ctx.globalAlpha=0.55;
      ctx.fillText(o.emoji,sx,sy);ctx.globalAlpha=1;
      if(o.hp<o.maxHp){
        const bw=size*0.7;
        ctx.fillStyle='#000';ctx.fillRect(sx-bw/2,sy-size*1.0,bw,4);
        ctx.fillStyle=o.type==='mega'?'#ff3322':'#33dd44';
        ctx.fillRect(sx-bw/2,sy-size*1.0,bw*(o.hp/o.maxHp),4);
      }
    } else if(t==='med'){
      const size=Math.min(CH*0.5,CH/d*0.4);
      const sy=CH/2+(CH/d)/2;
      ctx.font=`${size}px serif`;ctx.textAlign='center';ctx.textBaseline='bottom';
      ctx.fillText('🧰',sx,sy);
    } else {
      // пуля
      const size=Math.max(2,CH/d*0.05);
      const sy=CH/2;
      ctx.beginPath();ctx.arc(sx,sy,size,0,7);
      ctx.fillStyle='#ff6622';ctx.shadowColor='#ff0000';ctx.shadowBlur=8;ctx.fill();ctx.shadowBlur=0;
    }
  });

  // мини-радар
  const R=72,ox=8,oy=8,sc=R/MW;
  ctx.save();ctx.globalAlpha=0.7;
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(ox,oy,MW*sc,MH*sc);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){if(cell(x,y)===1){ctx.fillStyle='#3a2818';ctx.fillRect(ox+x*sc,oy+y*sc,sc,sc);}}
  ctx.fillStyle='#33dd44';ctx.fillRect(ox+px*sc-1,oy+py*sc-1,2,2);
  ctx.fillStyle='#ff3322';enemies.forEach(en=>{if(en.alive)ctx.fillRect(ox+en.x*sc-1,oy+en.y*sc-1,2,2);});
  ctx.fillStyle='#22ccff';medkits.forEach(m=>{if(!m.taken)ctx.fillRect(ox+m.x*sc-1,oy+m.y*sc-1,1,1);});
  ctx.restore();

  // полоска перезарядки
  if(reloadCd>0){
    const pct=1-reloadCd/60;
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(CW/2-30,CH-50,60,8);
    ctx.fillStyle='#fc6';ctx.fillRect(CW/2-30,CH-50,60*pct,8);
  }
}

function loop(){
  if(gameState!=='mission')return;
  move();updateEnemies();render();
  requestAnimationFrame(loop);
}

function lose(){
  gameState='gameover';stopMusic();
  hud.style.display='none';miss.style.display='none';gunEl.style.display='none';
  if(document.exitPointerLock)document.exitPointerLock();
  screen.innerHTML=`<h1>ТЫ ПОГИБ</h1>
    <p>Мир продолжил гнить без тебя.</p>
    <button class="btn" id="retry">ПОВТОРИТЬ МИССИЮ</button>
    <button class="btn alt" id="menuBtn">В МЕНЮ</button>`;
  screen.classList.remove('hidden');
  document.getElementById('retry').onclick=()=>startMission(curMission);
  document.getElementById('menuBtn').onclick=showMenu;
}

showMenu();
</script>
</body>
