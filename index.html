<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МИР НАСТОЛОК</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:'Orbitron',sans-serif;
    background:radial-gradient(circle at 50% -5%, #2a1d52 0%, #120a26 60%, #0a0612 100%);
    color:#ece6ff; min-height:100vh; padding:18px 16px 50px;
  }
  body.checking { visibility:hidden; }
  .wrap { max-width:760px; margin:0 auto; }
  .userbar { display:flex; align-items:center; justify-content:flex-end; gap:10px; margin-bottom:6px; }
  .userbar .who { font-size:11px; color:#b3a4e0; letter-spacing:1px; }
  .logout {
    font-family:'Orbitron'; font-size:11px; letter-spacing:1px; cursor:pointer;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.18); color:#b3a4e0;
    border-radius:8px; padding:7px 12px; transition:.15s;
  }
  .logout:active { transform:scale(.95); }
  .hero { text-align:center; margin:14px 0 30px; }
  .dice { font-size:50px; }
  h1 {
    font-family:'Russo One',sans-serif; font-size:42px; letter-spacing:3px; line-height:1.05;
    color:#fff; margin-top:6px; text-shadow:0 0 14px #8e44ad,0 0 30px #6c5ce7;
  }
  .tagline { font-size:13px; letter-spacing:4px; color:#b3a4e0; margin-top:10px; }
  .grid {
    display:grid; gap:16px;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  }
  .card {
    display:block; text-decoration:none; color:inherit; position:relative;
    background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.14); border-radius:16px; padding:22px 18px;
    transition:transform .15s, box-shadow .15s, border-color .15s; text-align:center;
  }
  .card:hover { transform:translateY(-5px); border-color:rgba(108,92,231,.7);
    box-shadow:0 8px 28px rgba(108,92,231,.35); }
  .card .emoji { font-size:44px; line-height:1; }
  .card .name { font-family:'Russo One'; font-size:22px; letter-spacing:1px; color:#fff; margin-top:10px; }
  .card .desc { font-size:12px; line-height:1.5; color:#b3a4e0; margin-top:6px; }
  .card.soon { opacity:.5; cursor:default; pointer-events:none; }
  .card.soon .badge {
    display:inline-block; margin-top:8px; font-size:10px; letter-spacing:2px;
    color:#b3a4e0; border:1px solid rgba(255,255,255,.2); border-radius:6px; padding:2px 8px;
  }
  footer { text-align:center; margin-top:40px; font-size:11px; letter-spacing:2px; color:#6a5f8c; }
  @media(max-width:480px){ h1{font-size:32px;} .grid{grid-template-columns:repeat(2,1fr);gap:12px;} }
</style>
</head>
<body class="checking">
 <div class="wrap">
  <div class="userbar">
    <span class="who" id="who"></span>
    <button class="logout" id="logout">ВЫЙТИ</button>
  </div>

  <div class="hero">
    <div class="dice">🎲</div>
    <h1>МИР НАСТОЛОК</h1>
    <div class="tagline">ИГРАЙ С ДРУЗЬЯМИ</div>
  </div>

  <div class="grid">
    <a class="card" href="2048.html">
      <div class="emoji">🔢</div>
      <div class="name">2048</div>
      <div class="desc">Складывай плитки и собери 2048</div>
    </a>
    <a class="card" href="durak-game.html">
      <div class="emoji">🃏</div>
      <div class="name">Дурак</div>
      <div class="desc">Подкидной и переводной · с ботами или по сети</div>
    </a>
    <a class="card" href="krestiki.html">
      <div class="emoji">❌⭕</div>
      <div class="name">Крестики-нолики</div>
      <div class="desc">С ботом (3 уровня) или вдвоём за телефоном</div>
    </a>
    <a class="card" href="morskoy-boy.html">
      <div class="emoji">🚢</div>
      <div class="name">Морской бой</div>
      <div class="desc">С ботом или по сети · со звуками</div>
    </a>
  </div>

  <footer>МИР НАСТОЛОК • играй и собирай рекорды</footer>
 </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://wifdphfkyfzgjrmrgvob.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_gOFAG3-xjA8GqFL_uDX5kg_ngk8dZkC';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // не вошёл — отправляем на страницу входа
  db.auth.getSession().then(({data})=>{
    if(!data.session){
      window.location.replace('login.html');
      return;
    }
    document.getElementById('who').textContent = data.session.user.email || '';
    document.body.classList.remove('checking');
  });

  document.getElementById('logout').onclick = async ()=>{
    await db.auth.signOut();
    window.location.replace('login.html');
  };
</script>
</body>
</html>
