  if(!audioCtx)return;
  const t=audioCtx.currentTime+when;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);

  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+0.02);
}

const DICT_SET = new Set(DICT);

// ============ ГЕНЕРАЦИЯ УРОВНЕЙ ============
// Берём случайное "ключевое" слово 3-9 букв, его буквы → набор для уровня
// Затем ищем в словаре все слова, которые можно собрать из этих букв
function canMakeWord(word, lettersCount){
  const c={...lettersCount};
  for(const ch of word){
    if(!c[ch])return false;
    c[ch]--;
  }
  return true;
}
function countLetters(letters){
  const c={};letters.forEach(l=>c[l]=(c[l]||0)+1);
  return c;
}

// слова разной длины для прогрессии
const KEY_WORDS_BY_LEN = {
  3:['кот','сон','лес','мир'],
  4:['роза','снег','кран','кино','стол','лето','куст'],
  5:['карта','город','книга','доска','лампа','школа','забор','песок'],
  6:['комета','ракета','слоник','машина','банан','рынок'],
  7:['коробка','самокат','капитан','караван','рассказ','стрелок'],
  8:['картошка','календарь','коридор','аппарат','аромат'],
  9:['бутерброд','велосипед','небосвод','солнышко']
};

// === Генерация уровней
const KEY_COUNTER={};
const KEY_LISTS={};
let prevKey=null; // последний выданный ключ — на следующем уровне не повторим
function shuffleArr(a){const c=a.slice();for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;}
for(const k in KEY_WORDS_BY_LEN){
  KEY_LISTS[k]=shuffleArr(KEY_WORDS_BY_LEN[k]);
  KEY_COUNTER[k]=0;
}

function pickKey(len, avoid){
  const list=KEY_LISTS[String(len)];
  if(!list || list.length===0) return null;
  // пробуем найти ключ, отличный от avoid
  for(let tries=0;tries<list.length+1;tries++){
    const idx=KEY_COUNTER[String(len)] % list.length;
    KEY_COUNTER[String(len)]++;
    const k=list[idx];
    if(k!==avoid) return k;
  }
  // если все совпадают (только 1 ключ в списке) — вернём как есть
  return list[0];
}

function generateLevel(idx){
  let targetLen;
  if(idx<3) targetLen=3;
  else if(idx<7) targetLen=4;
  else if(idx<11) targetLen=5;
  else if(idx<16) targetLen=6;
  else if(idx<21) targetLen=7;
  else if(idx<27) targetLen=8;
  else targetLen=9;
  if(idx>=30) targetLen=5+Math.floor(Math.random()*5);

  const listLen=(KEY_LISTS[String(targetLen)]||[]).length;
  for(let attempt=0;attempt<Math.max(listLen,1)*2;attempt++){
    const key=pickKey(targetLen, prevKey);
    if(!key) break;
    const letters=key.split('');
    const cnt=countLetters(letters);
    const candidates=DICT.filter(w=>w.length>=2 && w.length<=letters.length && canMakeWord(w,cnt));
    const uniq=[...new Set(candidates)];
    if(uniq.length>=3){
      uniq.sort((a,b)=>a.length-b.length||a.localeCompare(b));
      const shown=new Set();
      if(uniq.includes(key)) shown.add(key);
      for(const w of uniq){
        if(shown.size>=7)break;
        shown.add(w);
      }
      prevKey=key;
      return {letters, key, words:[...shown].slice(0,7), fullDict:new Set(uniq)};
    }
  }
  prevKey='кран';
  return {letters:['к','р','а','н'],key:'кран',words:['кран','рак','кар','нар','ран'],fullDict:new Set(['кран','рак','кар','нар','ран'])};
}

const CENTER={x:CW/2,y:CH/2}, RADIUS=100, LETTER_R=28;

function layoutLetters(){
  const lvl=currentLvl;
  activeLetters=[];
  const n=lvl.letters.length;
  const r = n<=5 ? 95 : (n<=7 ? 105 : 115);
  const lr = n<=5 ? 28 : (n<=7 ? 24 : 22);
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+(i/n)*Math.PI*2;
    activeLetters.push({
      ch:lvl.letters[i],
      x:CENTER.x+Math.cos(a)*r,
      y:CENTER.y+Math.sin(a)*r,
      r:lr,
      used:false,idx:i
    });
  }
}

function drawWheel(){
  ctx.clearRect(0,0,CW,CH);
  const lr0=activeLetters[0]?activeLetters[0].r:28;
  ctx.beginPath();ctx.arc(CENTER.x,CENTER.y,(activeLetters[0]?Math.hypot(activeLetters[0].x-CENTER.x,activeLetters[0].y-CENTER.y):RADIUS)+lr0+10,0,7);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fill();
  ctx.strokeStyle='#b88040';ctx.lineWidth=3;ctx.stroke();
  if(path.length>1){
    ctx.strokeStyle='#ffd060';ctx.lineWidth=6;ctx.lineCap='round';
    ctx.beginPath();
    path.forEach((idx,i)=>{
      const L=activeLetters[idx];
      if(i===0) ctx.moveTo(L.x,L.y);else ctx.lineTo(L.x,L.y);
    });
    ctx.stroke();
  }
  activeLetters.forEach(L=>{
    const sel=path.includes(L.idx);
    ctx.beginPath();ctx.arc(L.x,L.y,L.r,0,7);
    ctx.fillStyle=sel?'#ffd060':'#3a2818';
    ctx.shadowColor=sel?'#ff8800':'rgba(0,0,0,0)';
    ctx.shadowBlur=sel?15:0;
    ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle=sel?'#fff':'#b88040';ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle=sel?'#3a2010':'#ffd9a0';
    ctx.font=(L.r-2)+'px Russo One';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(L.ch.toUpperCase(),L.x,L.y);
  });
}

function renderWordGrid(){
  wordGridEl.innerHTML='';
  const lvl=currentLvl;
  const sorted=[...lvl.words].sort((a,b)=>{if(a.length!==b.length)return a.length-b.length;return a.localeCompare(b);});
  const byLen={};
  sorted.forEach(w=>{const k=w.length;if(!byLen[k])byLen[k]=[];byLen[k].push(w);});
  Object.keys(byLen).sort((a,b)=>a-b).forEach(len=>{
    byLen[len].forEach(w=>{
      const row=document.createElement('div');row.className='wordRow';
      for(let i=0;i<w.length;i++){
        const c=document.createElement('div');c.className='cell';
        if(foundWords.has(w)){c.classList.add('found');c.textContent=w[i].toUpperCase();}
        row.appendChild(c);
      }
      wordGridEl.appendChild(row);
    });
  });
  // показать бонусные слова в одну строку внизу
  if(bonusWords.size>0){
    const bonusBar=document.createElement('div');
    bonusBar.style.cssText='display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:8px;max-width:100%;';
    bonusBar.innerHTML='<div style="width:100%;text-align:center;color:#7ec8ff;font-family:Orbitron;font-size:11px;letter-spacing:2px;margin-bottom:2px;">⭐ ДОПОЛНИТЕЛЬНЫЕ:</div>';
    [...bonusWords].forEach(w=>{
      const tag=document.createElement('div');
      tag.style.cssText='background:rgba(40,80,140,.5);border:1px solid #7ec8ff;color:#cef;border-radius:5px;padding:2px 8px;font-size:13px;font-family:Russo One;text-transform:uppercase;';
      tag.textContent=w;
      bonusBar.appendChild(tag);
    });
    wordGridEl.appendChild(bonusBar);
  }
  foundCountEl.textContent=foundWords.size+'/'+lvl.words.length + (bonusWords.size>0?' +'+bonusWords.size:'');
}

function mousePos(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*(CW/r.width),y:(e.clientY-r.top)*(CH/r.height)};}
function letterAt(x,y){
  for(const L of activeLetters){if(Math.hypot(L.x-x,L.y-y)<L.r+2)return L;}
  return null;
}
function startDrag(e){
  initAudio();if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  const {x,y}=mousePos(e);const L=letterAt(x,y);
  if(L){mouseDown=true;path=[L.idx];curStr=L.ch;sfxTap();updateCurWord('');drawWheel();}
}
function moveDrag(e){
  if(!mouseDown)return;
  const {x,y}=mousePos(e);const L=letterAt(x,y);
  if(L){
    if(!path.includes(L.idx)){
      path.push(L.idx);curStr+=L.ch;sfxTap();updateCurWord('');drawWheel();
    } else if(path.length>=2 && path[path.length-2]===L.idx){
      path.pop();curStr=curStr.slice(0,-1);updateCurWord('');drawWheel();
    }
  }
}
function endDrag(){if(!mouseDown)return;mouseDown=false;checkWord();}

cv.addEventListener('mousedown',startDrag);
cv.addEventListener('mousemove',moveDrag);
window.addEventListener('mouseup',endDrag);
cv.addEventListener('touchstart',e=>{e.preventDefault();startDrag(e.touches[0]);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();moveDrag(e.touches[0]);},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();endDrag();},{passive:false});

function updateCurWord(stateCls){
  curWordEl.textContent=curStr.toUpperCase()||'\u00A0';
  curWordEl.className='';
  if(stateCls)curWordEl.classList.add(stateCls);
}

function checkWord(){
  if(curStr.length<2){path=[];curStr='';updateCurWord('');drawWheel();return;}
  const lvl=currentLvl;
  // Уже найденное (основное или бонус)
  if(foundWords.has(curStr) || bonusWords.has(curStr)){
    updateCurWord('repeat');sfxRepeat();
    setTimeout(()=>{path=[];curStr='';updateCurWord('');drawWheel();},400);
    return;
  }
  if(lvl.words.includes(curStr)){
    // основное слово уровня
    foundWords.add(curStr);
    updateCurWord('good');sfxFound();
    showPopup('+1');
    renderWordGrid();
    setTimeout(()=>{
      path=[];curStr='';updateCurWord('');drawWheel();
      if(foundWords.size>=lvl.words.length) levelComplete();
    },700);
  } else if(lvl.fullDict.has(curStr)){
    // дополнительное слово — есть в словаре, но не в основном списке
    bonusWords.add(curStr);
    updateCurWord('good');sfxFound();
    showPopup('⭐ ДОПОЛНИТЕЛЬНОЕ!');
    renderWordGrid();
    setTimeout(()=>{path=[];curStr='';updateCurWord('');drawWheel();},900);
  } else {
    updateCurWord('bad');sfxBad();
    setTimeout(()=>{path=[];curStr='';updateCurWord('');drawWheel();},500);
  }
}

function showPopup(txt){popupEl.textContent=txt;popupEl.classList.add('show');setTimeout(()=>popupEl.classList.remove('show'),600);}

document.getElementById('shuffleBtn').onclick=()=>{
  const arr=activeLetters.map(L=>L.ch);
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  for(let i=0;i<activeLetters.length;i++) activeLetters[i].ch=arr[i];
  drawWheel();sfxTap();
};
document.getElementById('hintBtn').onclick=()=>{
  const lvl=currentLvl;
  const remain=lvl.words.filter(w=>!foundWords.has(w));
  if(remain.length===0)return;
  const w=remain.sort((a,b)=>a.length-b.length)[0];
  foundWords.add(w);sfxFound();showPopup('💡 '+w.toUpperCase());
  renderWordGrid();
  if(foundWords.size>=lvl.words.length) setTimeout(levelComplete,800);
};

function startLevel(idx){
  curLevel=idx;
  currentLvl=generateLevel(idx);
  foundWords.clear();
  bonusWords.clear();
  layoutLetters();drawWheel();renderWordGrid();
  curStr='';path=[];updateCurWord('');
  lvlInfoEl.textContent='УРОВЕНЬ '+(curLevel+1);
  screen.classList.add('hidden');
}

function levelComplete(){
  sfxLevel();
  const bonusText = bonusWords.size>0 ? `<br><span style="color:#7ec8ff">⭐ Бонусных слов: ${bonusWords.size}</span>` : '';
  screen.innerHTML=`<h1>🎉 УРОВЕНЬ ${curLevel+1} ПРОЙДЕН!</h1>
    <p>Все ${currentLvl.words.length} слов найдены.${bonusText}</p>
    <p style="font-size:14px;color:#fca;">Дальше — уровень <b>${curLevel+2}</b></p>
    <button class="bigBtn" id="next">ДАЛЬШЕ ➔</button>`;
  screen.classList.remove('hidden');
  document.getElementById('next').onclick=()=>startLevel(curLevel+1);
}

function showMenu(){
  screen.innerHTML=`<h1>ГОРОД СЛОВ</h1>
    <h2>составь слова из букв</h2>
    <p>Перед тобой буквы по кругу. <b>Удерживай мышь</b> и проведи линию по буквам, чтобы собрать слово.</p>
    <p style="font-size:14px;color:#fca;">
    🔀 ПЕРЕМЕШАТЬ — поменять буквы местами<br>
    💡 ПОДСКАЗКА — открыть одно слово за тебя<br>
    ⭐ Найдёшь слово, которого нет в списке? Получишь <b>ДОПОЛНИТЕЛЬНОЕ</b>!<br>
    Уровней: <b>бесконечно</b> — играй сколько хочешь</p>
    <button class="bigBtn" id="start">НАЧАТЬ</button>`;
  screen.classList.remove('hidden');
  document.getElementById('start').onclick=()=>{
    for(const k in KEY_WORDS_BY_LEN){
      KEY_LISTS[k]=shuffleArr(KEY_WORDS_BY_LEN[k]);
      KEY_COUNTER[k]=0;
    }
    prevKey=null;
    startLevel(0);
  };
}

showMenu();
</script>
