<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ШАШКИ — Геймерский Уголок</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:'Orbitron',sans-serif;
    background:radial-gradient(circle at 50% 0%, #1a2540 0%, #0a0e1a 70%);
    color:#e8eefc; min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:14px; user-select:none;
  }
  h1 {
    font-family:'Russo One',sans-serif; font-size:34px; letter-spacing:4px;
    margin:6px 0 2px; color:#fff;
    text-shadow:0 0 12px #c0392b,0 0 26px #c0392b;
  }
  .sub { font-size:12px; letter-spacing:2px; color:#8fa3c8; margin-bottom:12px; }
  .status {
    font-family:'Russo One'; font-size:18px; min-height:26px; margin-bottom:10px;
    text-align:center; text-shadow:0 0 8px rgba(255,255,255,.2);
  }
  #board {
    display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr);
    width:min(92vw,460px); height:min(92vw,460px);
    border:4px solid #888; border-radius:6px;
    box-shadow:0 0 30px rgba(0,0,0,.5); overflow:hidden;
  }
  .cell { position:relative; display:flex; align-items:center; justify-content:center; }
  .light { background:#e8e8e8; }
  .dark  { background:#3a3a3a; }
  .cell.sel { box-shadow:inset 0 0 0 4px #f1c40f; }
  .cell.move::after {
    content:''; position:absolute; width:26%; height:26%; border-radius:50%;
    background:rgba(46,204,113,.85); box-shadow:0 0 10px #2ecc71;
  }
  .piece {
    width:74%; height:74%; border-radius:50%; position:relative;
    box-shadow:inset 0 -4px 6px rgba(0,0,0,.3),0 3px 5px rgba(0,0,0,.5);
    cursor:pointer; transition:transform .08s;
  }
  .piece.w { background:#ffffff; border:0.5px solid #aaa; }
  .piece.b { background:#1a1a1a; border:1px solid #000; }
  .piece.king::after {
    content:'♛'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:min(5vw,26px); color:#f1c40f; text-shadow:0 0 4px #000,0 0 2px #000;
  }
  .piece:active { transform:scale(.92); }
  .btn {
    font-family:'Russo One'; font-size:15px; letter-spacing:1px;
    margin-top:16px; padding:11px 26px; border:none; border-radius:8px;
    background:#1E88E5; color:#fff; cursor:pointer;
    box-shadow:0 0 16px rgba(30,136,229,.6); transition:.15s;
  }
  .btn:active { transform:scale(.95); }
  a.home { margin-top:14px; color:#8fa3c8; font-size:12px; letter-spacing:2px; text-decoration:none; }
  a.home:hover { color:#fff; }
  .score { font-size:13px; letter-spacing:1px; color:#9fb0d0; margin-bottom:8px; }
</style>
</head>
<body>
  <h1>ШАШКИ</h1>
  <div class="sub">РУССКИЕ ШАШКИ • ПРОТИВ БОТА</div>
  <div class="score" id="score">Ты (белые) 0 • 0 Бот (чёрные)</div>
  <div class="status" id="status">Твой ход — белые внизу</div>
  <div id="board"></div>
  <button class="btn" id="restart">🔄 НОВАЯ ИГРА</button>

<script>
// ===== ЗВУК (новый контекст под каждый звук, чтобы не было гула) =====
function tone(freq,dur,type,vol){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.value=vol||0.18;
    o.connect(g); g.connect(ctx.destination);
    o.start();
    g.gain.setValueAtTime(g.gain.value,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.stop(ctx.currentTime+dur);
    setTimeout(()=>ctx.close(),(dur+0.12)*1000);
  }catch(e){}
}
const sMove =()=>tone(420,0.08,'triangle',0.15);
const sTake =()=>{tone(220,0.07,'square',0.16);setTimeout(()=>tone(160,0.12,'square',0.14),60);};
const sKing =()=>{tone(660,0.1,'triangle',0.18);setTimeout(()=>tone(880,0.14,'triangle',0.16),90);};
const sWin  =()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.2,'triangle',0.2),i*130));};
const sLose =()=>{[440,330,247,196].forEach((f,i)=>setTimeout(()=>tone(f,0.25,'sawtooth',0.16),i*150));};

// ===== СОСТОЯНИЕ =====
// b[r][c]: 0 пусто, 1 белый, 2 белая дамка, -1 чёрный, -2 чёрная дамка
let b, turn, sel, legalMoves, busy, score={w:0,b:0};

function initBoard(){
  b=Array.from({length:8},()=>Array(8).fill(0));
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    if((r+c)%2===1){
      if(r<3) b[r][c]=-1;       // чёрные сверху
      else if(r>4) b[r][c]=1;   // белые снизу
    }
  }
}
const inB=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
const isWhite=v=>v>0, isBlack=v=>v<0, isKing=v=>Math.abs(v)===2;
const sideOf=v=>v>0?1:(v<0?-1:0);

// ===== ГЕНЕРАЦИЯ ХОДОВ (русские шашки: обязательный максимальный бой) =====
function pieceCaptures(board,r,c){
  // возвращает массив цепочек захвата: каждая = {path:[{r,c}], taken:[{r,c}]}
  const v=board[r][c]; const side=sideOf(v);
  const results=[];
  function rec(br,cr,cc,taken,path){
    let extended=false;
    const dirs=[[-1,-1],[-1,1],[1,-1],[1,1]];
    for(const[dr,dc]of dirs){
      if(isKing(v)){
        // дамка: ищем врага вдоль диагонали, за ним пустые клетки для приземления
        let rr=cr+dr, cc2=cc+dc, enemy=null;
        while(inB(rr,cc2)){
          const cell=br[rr][cc2];
          if(cell===0){ if(enemy){
              // можно приземлиться сюда
              const key=enemy.r+','+enemy.c;
              if(!taken.some(t=>t.r===enemy.r&&t.c===enemy.c)){
                const nb=br.map(row=>row.slice());
                nb[rr][cc2]=v; nb[cr][cc]=0; nb[enemy.r][enemy.c]=0;
                extended=true;
                rec(nb,rr,cc2,[...taken,{r:enemy.r,c:enemy.c}],[...path,{r:rr,c:cc2}]);
              }
            }
            rr+=dr; cc2+=dc; continue;
          }
          if(sideOf(cell)===side) break;
          // враг
          if(enemy) break; // два подряд — нельзя
          enemy={r:rr,c:cc2}; rr+=dr; cc2+=dc;
        }
      } else {
        // простая: бой вперёд и назад
        const mr=cr+dr, mc=cc+dc, lr=cr+2*dr, lc=cc+2*dc;
        if(inB(lr,lc)&&br[lr][lc]===0&&inB(mr,mc)){
          const mid=br[mr][mc];
          if(mid!==0&&sideOf(mid)!==side&&!taken.some(t=>t.r===mr&&t.c===mc)){
            const nb=br.map(row=>row.slice());
            nb[lr][lc]=v; nb[cr][cc]=0; nb[mr][mc]=0;
            extended=true;
            rec(nb,lr,lc,[...taken,{r:mr,c:mc}],[...path,{r:lr,c:lc}]);
          }
        }
      }
    }
    if(!extended && taken.length>0){
      results.push({path,taken:taken.slice()});
    }
  }
  rec(board,r,c,[],[{r,c}]);
  return results;
}

function pieceQuiet(board,r,c){
  const v=board[r][c]; const moves=[];
  if(isKing(v)){
    for(const[dr,dc]of[[-1,-1],[-1,1],[1,-1],[1,1]]){
      let rr=r+dr,cc=c+dc;
      while(inB(rr,cc)&&board[rr][cc]===0){ moves.push({path:[{r,c},{r:rr,c:cc}],taken:[]}); rr+=dr; cc+=dc; }
    }
  } else {
    const fdir = v>0?-1:1; // белые вверх, чёрные вниз
    for(const dc of[-1,1]){
      const rr=r+fdir, cc=c+dc;
      if(inB(rr,cc)&&board[rr][cc]===0) moves.push({path:[{r,c},{r:rr,c:cc}],taken:[]});
    }
  }
  return moves;
}

function allMoves(board,side){
  let caps=[], quiets=[];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    if(sideOf(board[r][c])===side){
      const pc=pieceCaptures(board,r,c);
      if(pc.length){ pc.forEach(m=>{m.from={r,c};caps.push(m);}); }
      else { pieceQuiet(board,r,c).forEach(m=>{m.from={r,c};quiets.push(m);}); }
    }
  }
  if(caps.length){
    const max=Math.max(...caps.map(m=>m.taken.length));
    return caps.filter(m=>m.taken.length===max); // обязательный максимальный бой
  }
  return quiets;
}

// применить ход к доске (с превращением в дамку)
function applyMove(board,m){
  const v=board[m.from.r][m.from.c];
  board[m.from.r][m.from.c]=0;
  m.taken.forEach(t=>board[t.r][t.c]=0);
  const end=m.path[m.path.length-1];
  let nv=v;
  if(v===1&&end.r===0) nv=2;
  if(v===-1&&end.r===7) nv=-2;
  board[end.r][end.c]=nv;
  return nv!==v && !isKing(v); // стал дамкой
}

// ===== ОТРИСОВКА =====
const boardEl=document.getElementById('board');
const statusEl=document.getElementById('status');
const scoreEl=document.getElementById('score');

function render(){
  boardEl.innerHTML='';
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const cell=document.createElement('div');
    cell.className='cell '+((r+c)%2===0?'light':'dark');
    cell.dataset.r=r; cell.dataset.c=c;
    const v=b[r][c];
    if(v!==0){
      const p=document.createElement('div');
      p.className='piece '+(v>0?'w':'b')+(isKing(v)?' king':'');
      cell.appendChild(p);
    }
    if(sel&&sel.r===r&&sel.c===c) cell.classList.add('sel');
    if(legalMoves&&legalMoves.some(m=>m.path[m.path.length-1].r===r&&m.path[m.path.length-1].c===c))
      cell.classList.add('move');
    cell.addEventListener('click',()=>onCell(r,c));
    boardEl.appendChild(cell);
  }
}

function onCell(r,c){
  if(busy||turn!==1) return;
  const v=b[r][c];
  // выбор своей шашки
  if(v>0){
    const myMoves=allMoves(b,1).filter(m=>m.from.r===r&&m.from.c===c);
    if(myMoves.length){ sel={r,c}; legalMoves=myMoves; render(); return; }
  }
  // клик по подсветке хода
  if(sel&&legalMoves){
    const m=legalMoves.find(mm=>{const e=mm.path[mm.path.length-1];return e.r===r&&e.c===c;});
    if(m){
      const becameKing=applyMove(b,m);
      if(m.taken.length) sTake(); else sMove();
      if(becameKing) sKing();
      sel=null; legalMoves=null; render();
      if(checkEnd()) return;
      turn=-1; statusEl.textContent='Ход бота…';
      busy=true; setTimeout(botMove,550);
    }
  }
}

// ===== БОТ (минимакс с альфа-бета, глубина 4) =====
function evaluate(board){
  let s=0;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const v=board[r][c];
    if(v===0)continue;
    let val=isKing(v)?5:1.5;
    // бонус за продвижение простых
    if(!isKing(v)){ val += v>0 ? (7-r)*0.04 : r*0.04; }
    s += sideOf(v)===-1 ? val : -val; // бот = чёрные максимизирует
  }
  return s;
}
function minimax(board,depth,side,alpha,beta){
  const moves=allMoves(board,side);
  if(depth===0||moves.length===0){
    if(moves.length===0) return side===-1?-1000:1000; // нет ходов = проигрыш
    return evaluate(board);
  }
  if(side===-1){ // максимизатор (бот)
    let best=-Infinity;
    for(const m of moves){
      const nb=board.map(row=>row.slice()); applyMove(nb,m);
      const val=minimax(nb,depth-1,1,alpha,beta);
      best=Math.max(best,val); alpha=Math.max(alpha,val);
      if(beta<=alpha)break;
    }
    return best;
  } else {
    let best=Infinity;
    for(const m of moves){
      const nb=board.map(row=>row.slice()); applyMove(nb,m);
      const val=minimax(nb,depth-1,-1,alpha,beta);
      best=Math.min(best,val); beta=Math.min(beta,val);
      if(beta<=alpha)break;
    }
    return best;
  }
}
function botMove(){
  const moves=allMoves(b,-1);
  if(moves.length===0){ checkEnd(); return; }
  let best=null,bestV=-Infinity;
  for(const m of moves){
    const nb=b.map(row=>row.slice()); applyMove(nb,m);
    const v=minimax(nb,3,1,-Infinity,Infinity)+Math.random()*0.05;
    if(v>bestV){bestV=v;best=m;}
  }
  const becameKing=applyMove(b,best);
  if(best.taken.length) sTake(); else sMove();
  if(becameKing) sKing();
  render();
  busy=false;
  if(checkEnd())return;
  turn=1; statusEl.textContent='Твой ход';
}

function checkEnd(){
  const wPieces=b.flat().filter(v=>v>0).length;
  const bPieces=b.flat().filter(v=>v<0).length;
  const wMoves=allMoves(b,1).length;
  const bMoves=allMoves(b,-1).length;
  if(bPieces===0||bMoves===0){
    statusEl.textContent='🏆 ТЫ ПОБЕДИЛ!'; score.w++; updScore(); sWin(); busy=true; turn=0; return true;
  }
  if(wPieces===0||wMoves===0){
    statusEl.textContent='😢 БОТ ПОБЕДИЛ'; score.b++; updScore(); sLose(); busy=true; turn=0; return true;
  }
  return false;
}
function updScore(){ scoreEl.textContent=`Ты (белые) ${score.w} • ${score.b} Бот (чёрные)`; }

function newGame(){
  initBoard(); turn=1; sel=null; legalMoves=null; busy=false;
  statusEl.textContent='Твой ход — белые внизу';
  render();
}
document.getElementById('restart').addEventListener('click',newGame);
newGame();
</script>
</body>
</html>
