<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ВОЛНЫ — Шутер</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;}
  body{font-family:'Oswald',sans-serif;background:#000;min-height:100vh;
    display:flex;align-items:center;justify-content:center;overflow:hidden;}
  #wrap{position:relative;width:780px;max-width:97vw;height:490px;max-height:83vh;
    border-radius:8px;overflow:hidden;box-shadow:0 0 60px rgba(255,80,40,.3);
    background:#000;cursor:crosshair;}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;}
  #touchControls{position:absolute;inset:0;z-index:8;pointer-events:none;}
  #joystick{position:absolute;left:16px;bottom:16px;width:104px;height:104px;
    border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);
    pointer-events:auto;touch-action:none;z-index:10;}
  #joyKnob{position:absolute;left:30px;top:30px;width:44px;height:44px;border-radius:50%;
    background:rgba(255,200,80,.5);border:2px solid rgba(255,255,255,.5);}
  #lookZone{position:absolute;right:0;top:0;width:55%;height:100%;pointer-events:auto;touch-action:none;}
  #fireBtn{position:absolute;right:18px;bottom:24px;width:80px;height:80px;border-radius:50%;
    background:rgba(255,80,60,.35);border:3px solid rgba(255,120,90,.7);
    display:flex;align-items:center;justify-content:center;font-size:34px;
    pointer-events:auto;touch-action:none;user-select:none;z-index:10;}
  #fireBtn:active{background:rgba(255,80,60,.6);}
  #weaponBtn{position:absolute;right:110px;bottom:30px;width:56px;height:56px;border-radius:50%;
    background:rgba(80,160,255,.35);border:2px solid rgba(120,200,255,.7);
    display:flex;align-items:center;justify-content:center;font-size:26px;
    pointer-events:auto;touch-action:none;user-select:none;z-index:10;}
  #weaponBtn:active{background:rgba(80,160,255,.6);}
  .crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    z-index:4;pointer-events:none;width:22px;height:22px;}
  .crosshair::before,.crosshair::after{content:'';position:absolute;background:rgba(255,200,120,.85);}
  .crosshair::before{left:50%;top:0;width:2px;height:22px;transform:translateX(-50%);}
  .crosshair::after{top:50%;left:0;height:2px;width:22px;transform:translateY(-50%);}
  #hud{position:absolute;bottom:0;left:0;right:0;z-index:5;display:flex;
    justify-content:space-between;padding:10px 18px;
    background:linear-gradient(0deg,rgba(0,0,0,.8),transparent);
    color:#ffcc33;font-size:19px;font-weight:700;letter-spacing:1px;
    text-shadow:0 0 8px rgba(255,150,40,.6);}
  #hud .hp{color:#ff5544;}
  #waveTop{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:5;
    color:#ffaa33;font-size:22px;font-weight:900;letter-spacing:3px;
    text-shadow:0 0 14px #ff6600;pointer-events:none;background:rgba(0,0,0,.4);padding:4px 18px;border-radius:6px;}
  #scoreTop{position:absolute;top:8px;right:14px;z-index:5;color:#fff;font-size:14px;
    text-shadow:0 0 8px #000;pointer-events:none;}
  #gun{position:absolute;bottom:-12px;right:24px;z-index:3;font-size:130px;
    transform:scaleX(-1) rotate(-8deg);filter:drop-shadow(-4px -6px 8px rgba(0,0,0,.7));
    pointer-events:none;transition:transform .05s;}
  #gun.fire{transform:scaleX(-1) rotate(-8deg) translateY(10px);}
  #muzzle{position:absolute;bottom:60px;right:50px;z-index:4;font-size:70px;opacity:0;pointer-events:none;}
  #flash{position:absolute;inset:0;z-index:3;background:#aa0000;opacity:0;pointer-events:none;transition:opacity .1s;}
  #waveBanner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:8;
    color:#fff;font-size:60px;font-weight:900;letter-spacing:5px;text-shadow:0 0 30px #ff5500;
    opacity:0;pointer-events:none;transition:opacity .4s;}
  #screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    background:rgba(8,4,4,.9);color:#cde;padding:24px;}
  #screen.hidden{display:none;}
  h1{font-size:48px;color:#ffaa33;text-shadow:0 0 24px #ff5500;margin-bottom:12px;letter-spacing:4px;}
  p{font-size:16px;line-height:1.8;margin-bottom:24px;color:#bcd;}
  .key{background:#241410;border:1px solid #b08030;border-radius:4px;padding:2px 9px;color:#ffd060;}
  .btn{background:linear-gradient(135deg,#ff8822,#cc4400);color:#fff;border:none;
    border-radius:6px;padding:14px 46px;font-family:'Oswald';font-size:21px;font-weight:700;
    cursor:pointer;letter-spacing:2px;box-shadow:0 0 28px rgba(255,100,40,.6);text-transform:uppercase;}
  .btn:active{transform:scale(.96);}
  .record{color:#ffd060;font-size:20px;margin-top:8px;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="390" height="245"></canvas>
  <div id="waveTop">ВОЛНА 1</div>
  <div id="scoreTop">Очки: 0 &nbsp; Рекорд: 0</div>
  <div class="crosshair"></div>
  <div id="muzzle">💥</div>
  <div id="gun">🔫</div>
  <div id="flash"></div>
  <div id="waveBanner"></div>
  <div id="hud">
    <div class="hp">❤ <span id="hp">100</span></div>
    <div><span id="wname">АК-47</span> <span id="ammo">30</span>/<span id="reserve">299</span></div>
    <div id="left">Врагов: 0</div>
  </div>
  <div id="touchControls" style="display:none">
    <div id="joystick"><div id="joyKnob"></div></div>
    <div id="lookZone"></div>
    <div id="fireBtn">🔫</div>
    <div id="weaponBtn">🔄</div>
  </div>
  <div id="screen">
    <h1>⚡ ВОЛНЫ ⚡</h1>
    <p>
      <span class="key">W A S D</span> — движение &nbsp;|&nbsp; <span class="key">мышь</span> — обзор<br>
      <span class="key">ЛКМ</span> — огонь &nbsp;|&nbsp; <span class="key">R</span> — перезарядка<br>
      <span class="key">1</span> АК-47 &nbsp; <span class="key">2</span> дробовик &nbsp; <span class="key">Q</span> сменить<br><br>
      Бесконечные волны врагов 🧟 👹 👺.<br>Враги становятся сильнее с каждой волной.<br>Выживай как можно дольше!
    </p>
    <div class="record" id="recordTxt"></div>
    <button class="btn" id="startBtn">НАЧАТЬ</button>
  </div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const wrap=document.getElementById('wrap');
const hpEl=document.getElementById('hp'),ammoEl=document.getElementById('ammo'),reserveEl=document.getElementById('reserve'),leftEl=document.getElementById('left');
const screen=document.getElementById('screen'),startBtn=document.getElementById('startBtn');
const flash=document.getElementById('flash'),muzzle=document.getElementById('muzzle'),gun=document.getElementById('gun');
const waveTop=document.getElementById('waveTop'),scoreTop=document.getElementById('scoreTop'),banner=document.getElementById('waveBanner');
const recordTxt=document.getElementById('recordTxt');
const CW=cv.width,CH=cv.height;

// карта арены: 1 = стена, 0 = пол. Открытое поле со столбами-укрытиями.
const MAP=[
 "1111111111111111111",
 "1000000000000000001",
 "1000110000000110001",
 "1000110001100110001",
 "1000000001100000001",
 "1001100000000011001",
 "1001100000000011001",
 "1000000011110000001",
 "1000000011110000001",
 "1001100000000011001",
 "1001100000000011001",
 "1000000001100000001",
 "1000110001100110001",
 "1000110000000110001",
 "1000000000000000001",
 "1111111111111111111",
];
const MH=MAP.length,MW=MAP[0].length;
function cell(x,y){if(x<0||y<0||x>=MW||y>=MH)return 1;return MAP[y|0][x|0]==='1'?1:0;}

// типы врагов
const ENEMY_TYPES={
  zombie:   {emoji:'🧟', hp:40,   speed:0.009,  dmg:8,  color:'#88aa44', score:10,  drop:0.3},
  alien:    {emoji:'👹', hp:90,   speed:0.0135, dmg:10, color:'#aa44aa', score:25,  drop:0.4},
  boss:     {emoji:'👺', hp:250,  speed:0.0105, dmg:20, color:'#ff3322', score:100, drop:0.8},
  megaboss: {emoji:'😈', hp:1000, speed:0.0075, dmg:30, color:'#ff1111', score:500, drop:1.0}
};

const WEAPONS={
  ak:   {name:'АК-47',    mag:30, rate:6,  auto:true,  dmg:25, recoil:0.012},
  shot: {name:'Дробовик', mag:8,  rate:24, auto:false, dmg:80, recoil:0.025, spread:0.18, pellets:5}
};

let px,py,pa,hp,maxHp=100,ammo,reserve,enemies,drops,playing,keys={},damageCd,fireCd,turnBuffer=0,recoil,weapon,wave,score,record=0,waveTimer,inWaveBreak;

function reset(){
  px=2.5;py=2.5;pa=0;hp=maxHp;weapon='ak';ammo=WEAPONS.ak.mag;reserve=299;
  damageCd=0;fireCd=0;turnBuffer=0;recoil=0;firing=false;
  enemies=[];drops=[];wave=0;score=0;waveTimer=0;inWaveBreak=false;
  playing=true;
  hpEl.textContent=hp;ammoEl.textContent=ammo;reserveEl.textContent=reserve;
  updHud();updScore();
  nextWave();
}

function updHud(){
  ammoEl.textContent=ammo;reserveEl.textContent=reserve;
  document.getElementById('wname').textContent=WEAPONS[weapon].name;
}
function updScore(){
  scoreTop.textContent=`Очки: ${score} \u00A0 Рекорд: ${record}`;
  waveTop.textContent=`ВОЛНА ${wave}`;
  leftEl.textContent='Врагов: '+enemies.filter(e=>e.alive).length;
}

function showBanner(text,color){
  banner.textContent=text;
  banner.style.color=color||'#fff';
  banner.style.opacity=1;
  setTimeout(()=>banner.style.opacity=0,1600);
}

function nextWave(){
  wave++;
  let counts={zombie:0,alien:0,boss:0,megaboss:0};
  // волна кратная 10 — только мегабосс, никого больше
  if(wave%10===0){
    counts.megaboss=1;
  } else {
    counts.zombie = 3 + Math.floor(wave*1.2);
    if(wave>=3) counts.alien = Math.floor((wave-2)*0.8);
    if(wave>=5 && wave%2===0) counts.boss = Math.floor(wave/5);
  }
  // бафф: каждая волна +20% хп (скорость постоянная)
  const buff = 1 + (wave-1)*0.2;
  const sbuff = 1;
  const spawnEnemy=(type)=>{
    const t=ENEMY_TYPES[type];
    for(let a=0;a<200;a++){
      const ex=1.5+Math.random()*(MW-3),ey=1.5+Math.random()*(MH-3);
      if(cell(ex,ey)===0 && Math.hypot(ex-px,ey-py)>5){
        enemies.push({type,x:ex,y:ey,hp:t.hp*buff,maxhp:t.hp*buff,speed:t.speed*sbuff,dmg:t.dmg,emoji:t.emoji,score:t.score,drop:t.drop,alive:true,hurt:0,jump:Math.random()*6,fireCd:0});
        return;
      }
    }
  };
  for(let i=0;i<counts.zombie;i++) spawnEnemy('zombie');
  for(let i=0;i<counts.alien;i++) spawnEnemy('alien');
  for(let i=0;i<counts.boss;i++) spawnEnemy('boss');
  for(let i=0;i<counts.megaboss;i++) spawnEnemy('megaboss');
  if(wave%10===0) showBanner('⚠ МЕГАБОСС ⚠','#ff2222');
  else showBanner('ВОЛНА '+wave,'#ffaa33');
  inWaveBreak=false;
  updScore();
}

document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='KeyR')reload();
  if(e.code==='Digit1')switchWeapon('ak');
  if(e.code==='Digit2')switchWeapon('shot');
  if(e.code==='KeyQ')switchWeapon(weapon==='ak'?'shot':'ak');
  if(e.code==='Space'){e.preventDefault();}
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

function switchWeapon(w){
  if(!playing||weapon===w)return;
  weapon=w;
  const mag=WEAPONS[w].mag;
  if(ammo>mag){reserve+=ammo-mag;ammo=mag;}
  updHud();
}

let firing=false;
wrap.addEventListener('mousedown',e=>{
  if(!playing)return;
  if(document.pointerLockElement!==wrap){wrap.requestPointerLock();}
  firing=true; e.preventDefault();
});
document.addEventListener('mouseup',()=>{firing=false;});
document.addEventListener('mousemove',e=>{
  if(!playing)return;
  if(document.pointerLockElement===wrap){
    turnBuffer+=e.movementX*0.0008;
  }
});

// ===== ТАЧ-УПРАВЛЕНИЕ (FPS) =====
const touchControls=document.getElementById('touchControls');
const joystick=document.getElementById('joystick');
const joyKnob=document.getElementById('joyKnob');
const lookZone=document.getElementById('lookZone');
const fireBtnEl=document.getElementById('fireBtn');
const weaponBtnEl=document.getElementById('weaponBtn');
let joyFX=0, joyFY=0;
if(('ontouchstart' in window) || navigator.maxTouchPoints>0){
  touchControls.style.display='block';
}
joystick.addEventListener('touchstart',e=>{e.preventDefault();updJoy(e.touches[0]);},{passive:false});
joystick.addEventListener('touchmove',e=>{e.preventDefault();updJoy(e.touches[0]);},{passive:false});
joystick.addEventListener('touchend',e=>{e.preventDefault();joyFX=0;joyFY=0;joyKnob.style.left='30px';joyKnob.style.top='30px';},{passive:false});
function updJoy(t){
  const r=joystick.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  let dx=t.clientX-cx, dy=t.clientY-cy;
  const maxR=r.width/2-8;
  const d=Math.hypot(dx,dy);
  if(d>maxR){dx=dx/d*maxR;dy=dy/d*maxR;}
  joyKnob.style.left=(30+dx)+'px';
  joyKnob.style.top=(30+dy)+'px';
  joyFX=dx/maxR; joyFY=-dy/maxR;
}
let lookLastX=null;
lookZone.addEventListener('touchstart',e=>{e.preventDefault();lookLastX=e.touches[0].clientX;},{passive:false});
lookZone.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(lookLastX!==null){const nx=e.touches[0].clientX;turnBuffer+=(nx-lookLastX)*0.004;lookLastX=nx;}
},{passive:false});
lookZone.addEventListener('touchend',e=>{e.preventDefault();lookLastX=null;},{passive:false});
fireBtnEl.addEventListener('touchstart',e=>{e.preventDefault();firing=true;},{passive:false});
fireBtnEl.addEventListener('touchend',e=>{e.preventDefault();firing=false;},{passive:false});
weaponBtnEl.addEventListener('touchstart',e=>{e.preventDefault();switchWeapon(weapon==='ak'?'shot':'ak');},{passive:false});


function reload(){
  const mag=WEAPONS[weapon].mag;
  if(!playing||ammo>=mag||reserve<=0)return;
  const need=mag-ammo,take=Math.min(need,reserve);
  ammo+=take;reserve-=take;updHud();
}

function shoot(){
  if(ammo<=0){ if(reserve>0) reload(); return; }
  ammo--;updHud();
  muzzle.style.opacity=1;gun.classList.add('fire');recoil=WEAPONS[weapon].recoil;
  setTimeout(()=>{muzzle.style.opacity=0;gun.classList.remove('fire');},45);
  const W=WEAPONS[weapon];
  if(W.pellets){
    // дробовик — несколько лучей с разбросом
    for(let p=0;p<W.pellets;p++){
      const aOff=(Math.random()-0.5)*W.spread;
      hitscan(aOff,W.dmg);
    }
  } else {
    hitscan(0,W.dmg);
  }
}

function hitscan(aOff,dmg){
  let best=null,bd=99;
  enemies.forEach(en=>{
    if(!en.alive)return;
    let ang=Math.atan2(en.y-py,en.x-px)-(pa+aOff);
    while(ang<-Math.PI)ang+=2*Math.PI;while(ang>Math.PI)ang-=2*Math.PI;
    const d=Math.hypot(en.x-px,en.y-py);
    if(Math.abs(ang)<0.08&&d<bd&&!wallBetween(px,py,en.x,en.y)){best=en;bd=d;}
  });
  if(best){
    best.hp-=dmg;best.hurt=6;
    if(best.hp<=0){
      best.alive=false;score+=best.score;
      if(Math.random()<best.drop) dropItem(best.x,best.y);
      checkWaveDone();
    }
    updScore();
  }
}

function dropItem(x,y){
  const types=['health','ammo','ammo']; // больше шанс патронов
  const t=types[Math.floor(Math.random()*types.length)];
  drops.push({x,y,type:t,taken:false});
}

function checkWaveDone(){
  if(enemies.every(e=>!e.alive) && !inWaveBreak){
    inWaveBreak=true;
    showBanner('ВОЛНА '+wave+' ПРОЙДЕНА!','#33ff66');
    waveTimer=120; // ~2 сек паузы перед следующей волной
  }
}

function move(){
  let dx=0,dy=0,sp=0.019;
  if(keys['KeyW']){dx+=Math.cos(pa)*sp;dy+=Math.sin(pa)*sp;}
  if(keys['KeyS']){dx-=Math.cos(pa)*sp;dy-=Math.sin(pa)*sp;}
  if(keys['KeyA']){dx+=Math.cos(pa-Math.PI/2)*sp;dy+=Math.sin(pa-Math.PI/2)*sp;}
  if(keys['KeyD']){dx+=Math.cos(pa+Math.PI/2)*sp;dy+=Math.sin(pa+Math.PI/2)*sp;}
  if(joyFY!==0 || joyFX!==0){
    dx+=Math.cos(pa)*sp*joyFY + Math.cos(pa+Math.PI/2)*sp*joyFX;
    dy+=Math.sin(pa)*sp*joyFY + Math.sin(pa+Math.PI/2)*sp*joyFX;
  }
  if(keys['ArrowLeft'])pa-=0.045;
  if(keys['ArrowRight'])pa+=0.045;
  let step=turnBuffer*0.18;const mx=0.06;
  if(step>mx)step=mx;if(step<-mx)step=-mx;pa+=step;turnBuffer-=step;
  const R=0.22;
  if(cell(px+Math.sign(dx)*R+dx,py)===0)px+=dx;
  if(cell(px,py+Math.sign(dy)*R+dy)===0)py+=dy;
}

function updateEnemies(){
  damageCd--;fireCd--;
  const W=WEAPONS[weapon];
  if(firing&&fireCd<=0){
    shoot();fireCd=W.rate;
    if(!W.auto)firing=false;
  }
  // подбор лута
  drops.forEach(dr=>{
    if(dr.taken)return;
    if(Math.hypot(dr.x-px,dr.y-py)<0.6){
      dr.taken=true;
      if(dr.type==='health'){hp=Math.min(maxHp,hp+25);hpEl.textContent=hp;}
      if(dr.type==='ammo'){reserve+=20;updHud();}
    }
  });
  // враги
  enemies.forEach(en=>{
    if(!en.alive)return;
    if(en.hurt>0)en.hurt--;
    en.jump+=0.18;
    const d=Math.hypot(en.x-px,en.y-py);
    if(d>0.8){
      const sp=en.speed,R=0.25;
      const ex=(en.x-px)/d*sp, ey=(en.y-py)/d*sp;
      const tx=en.x-ex;
      if(cell(tx+Math.sign(-ex)*R,en.y)===0) en.x=tx;
      const ty=en.y-ey;
      if(cell(en.x,ty+Math.sign(-ey)*R)===0) en.y=ty;
    }
    if(d<0.9&&damageCd<=0){
      hp-=en.dmg;damageCd=120;hpEl.textContent=Math.max(0,hp);
      flash.style.opacity=0.5;setTimeout(()=>flash.style.opacity=0,110);
      if(hp<=0)lose();
    }
  });
  // пауза между волнами
  if(inWaveBreak){
    waveTimer--;
    if(waveTimer<=0) nextWave();
  }
}

function wallBetween(x1,y1,x2,y2){
  const dist=Math.hypot(x2-x1,y2-y1);
  const steps=Math.ceil(dist*14);
  for(let i=1;i<steps;i++){const t=i/steps;if(cell(x1+(x2-x1)*t,y1+(y2-y1)*t)===1)return true;}
  return false;
}

// ---------- РЕНДЕР ----------
const FOV=Math.PI/3;
const depth=new Array(CW);
function render(){
  // небо/земля
  const sky=ctx.createLinearGradient(0,0,0,CH/2);
  sky.addColorStop(0,'#1a1014');sky.addColorStop(1,'#3a1418');
  ctx.fillStyle=sky;ctx.fillRect(0,0,CW,CH/2);
  const gr=ctx.createLinearGradient(0,CH/2,0,CH);
  gr.addColorStop(0,'#2a1a14');gr.addColorStop(1,'#0c0806');
  ctx.fillStyle=gr;ctx.fillRect(0,CH/2,CW,CH/2);

  for(let col=0;col<CW;col++){
    const rayA=pa-FOV/2+(col/CW)*FOV,cos=Math.cos(rayA),sin=Math.sin(rayA);
    let dist=0,hit=false;
    while(!hit&&dist<22){dist+=0.025;if(cell(px+cos*dist,py+sin*dist)===1)hit=true;}
    const corr=dist*Math.cos(rayA-pa);depth[col]=corr;
    const h=Math.min(CH,CH/corr);
    const fog=Math.max(0.15,1-corr/14);
    const gx=px+cos*dist,gy=py+sin*dist;
    const grid=(Math.floor(gx*2)+Math.floor(gy*2))%2;
    const base=grid?[110,75,55]:[80,55,42];
    ctx.fillStyle=`rgb(${(base[0]*fog)|0},${(base[1]*fog)|0},${(base[2]*fog)|0})`;
    ctx.fillRect(col,(CH-h)/2,1,h);
  }

  // спрайты: враги + лут
  const sprites=[];
  enemies.forEach(en=>{if(en.alive)sprites.push({t:'enemy',o:en,d:Math.hypot(en.x-px,en.y-py)});});
  drops.forEach(dr=>{if(!dr.taken)sprites.push({t:'drop',o:dr,d:Math.hypot(dr.x-px,dr.y-py)});});
  sprites.sort((a,b)=>b.d-a.d);
  sprites.forEach(({t,o,d})=>{
    let ang=Math.atan2(o.y-py,o.x-px)-pa;
    while(ang<-Math.PI)ang+=2*Math.PI;while(ang>Math.PI)ang-=2*Math.PI;
    if(Math.abs(ang)>FOV/1.4)return;
    if(wallBetween(px,py,o.x,o.y))return;
    const sx=(0.5+ang/FOV)*CW;
    if(t==='enemy'){
      const baseSize = o.type==='megaboss'?2.6:(o.type==='boss'?1.8:(o.type==='alien'?1.4:1.2));
      const size=Math.min(CH*baseSize,CH/d*baseSize*0.8);
      const bob=Math.abs(Math.sin(o.jump))*size*0.12;
      const sy=CH/2+size/2-bob;
      ctx.font=`${size}px serif`;ctx.textAlign='center';ctx.textBaseline='bottom';
      if(o.hurt>0)ctx.globalAlpha=0.55;
      ctx.fillText(o.emoji,sx,sy);ctx.globalAlpha=1;
      // полоска хп над врагом
      if(o.hp<o.maxhp){
        const bw=size*0.7;
        ctx.fillStyle='#000';ctx.fillRect(sx-bw/2,sy-size*1.0,bw,4);
        ctx.fillStyle=o.type==='boss'?'#ff3322':'#33dd44';
        ctx.fillRect(sx-bw/2,sy-size*1.0,bw*(o.hp/o.maxhp),4);
      }
    } else {
      const size=Math.min(CH*0.5,CH/d*0.4);
      const sy=CH/2+(CH/d)/2;
      ctx.font=`${size}px serif`;ctx.textAlign='center';ctx.textBaseline='bottom';
      ctx.fillText(o.type==='health'?'❤️':'📦',sx,sy);
    }
  });

  // мини-радар
  const R=70,ox=10,oy=30,sc=R/MW;
  ctx.save();ctx.globalAlpha=0.75;
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(ox,oy,MW*sc,MH*sc);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){if(cell(x,y)===1){ctx.fillStyle='#553322';ctx.fillRect(ox+x*sc,oy+y*sc,sc,sc);}}
  ctx.fillStyle='#33dd44';ctx.fillRect(ox+px*sc-1,oy+py*sc-1,3,3);
  enemies.forEach(en=>{
    if(!en.alive)return;
    ctx.fillStyle=en.type==='megaboss'?'#ff0000':(en.type==='boss'?'#ff3322':(en.type==='alien'?'#dd55ff':'#aaff44'));
    const s=en.type==='megaboss'?4:2;
    ctx.fillRect(ox+en.x*sc-s/2,oy+en.y*sc-s/2,s,s);
  });
  ctx.restore();
}

function loop(){if(!playing)return;move();updateEnemies();render();requestAnimationFrame(loop);}

function lose(){
  playing=false;
  if(document.exitPointerLock)document.exitPointerLock();
  if(score>record){record=score;try{localStorage.setItem('wavesRecord',record);}catch(e){}}
  screen.classList.remove('hidden');
  screen.innerHTML=`<h1>💀 ТЫ ПОГИБ</h1>
    <p>Дошёл до волны: <b>${wave}</b><br>Очки: <b>${score}</b><br>Рекорд: <b>${record}</b></p>
    <button class="btn" id="again">ЕЩЁ РАЗ</button>`;
  document.getElementById('again').onclick=startGame;
}

function startGame(){
  try{record=parseInt(localStorage.getItem('wavesRecord'))||0;}catch(e){record=0;}
  screen.classList.add('hidden');
  reset();wrap.requestPointerLock();loop();
}
// показать рекорд на стартовом экране
try{record=parseInt(localStorage.getItem('wavesRecord'))||0;}catch(e){record=0;}
recordTxt.textContent=record>0?('Твой рекорд: '+record+' очков'):'';

startBtn.onclick=startGame;
</script>
